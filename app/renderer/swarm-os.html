<!doctype html>
<html lang="en" data-theme="forge" data-density="comfortable" data-motion="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SWARM OS — Agentic Super Harness</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05070d">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SWARM OS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="A single-file agentic AI operating system: chat directly with an orchestrator model that calls other OpenRouter models as tools to build a swarm, with an enforced Definition of Done on every run.">
<style>
/* ============================================================================
   SWARM OS — token layer.
   Theme presets set the palette. The Design Studio writes inline custom
   properties onto <html>, which beat these rules, so both systems compose.
   ========================================================================== */
:root{
  color-scheme:dark;
  --bg:#05070d;--bg2:#0c1220;--bg3:#101827;
  --panel:rgba(13,18,31,.86);--panel2:rgba(8,12,22,.94);--panel3:rgba(255,255,255,.045);
  --line:rgba(190,210,255,.14);--line2:rgba(190,210,255,.26);
  --text:#eef5ff;--muted:#8ea0b8;--soft:#c8d6ed;
  --accent:#f7bd56;--accent2:#ffdc87;--red:#ff375f;--blue:#38bdf8;--violet:#a78bfa;
  --green:#2ee59d;--amber:#f6b342;--danger:#ef4444;
  --shadow:0 24px 80px rgba(0,0,0,.44);--glow:0 0 32px rgba(56,189,248,.18);
  --r:20px;--r2:14px;--r3:10px;--blur:18px;
  --font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"SFMono-Regular","Cascadia Code","JetBrains Mono",Consolas,Menlo,monospace;
  --maxw:2100px;--pad:20px;--gap:14px;--fs:14px;
}
html[data-theme=forge]{--accent:#f7bd56;--accent2:#ffdc87;--blue:#73ddff;--violet:#c7a3ff;--green:#62eaa7;--red:#ff8192}
html[data-theme=redblue]{--bg:#080812;--bg2:#141327;--panel:rgba(17,22,37,.91);--red:#ff315c;--blue:#33d7ff;--accent:#7c3aed;--accent2:#a78bfa;--violet:#c084fc}
html[data-theme=terminal]{--bg:#010603;--bg2:#07120b;--panel:rgba(7,18,11,.93);--text:#d8ffe5;--muted:#7bcc9a;--red:#ff6363;--blue:#45d5ff;--accent:#22c55e;--accent2:#86efac;--green:#86efac}
html[data-theme=aurora]{--bg:#060819;--bg2:#121134;--red:#fb7185;--blue:#22d3ee;--accent:#d946ef;--accent2:#f0abfc;--green:#34d399}
html[data-theme=slate]{--bg:#0e1728;--bg2:#101827;--red:#f43f5e;--blue:#0ea5e9;--accent:#6366f1;--accent2:#a5b4fc}
html[data-theme=mono]{--bg:#000;--bg2:#0a0a0a;--panel:rgba(17,17,17,.94);--text:#fff;--muted:#a1a1aa;--red:#f5f5f5;--blue:#d4d4d4;--accent:#fff;--accent2:#e5e5e5;--green:#e5e5e5;--line:rgba(255,255,255,.28)}
html[data-theme=ocean]{--bg:#03131d;--bg2:#062333;--red:#fb7185;--blue:#67e8f9;--accent:#2dd4bf;--accent2:#5eead4;--green:#45e0a7}
html[data-theme=ember]{--bg:#120707;--bg2:#20100e;--red:#ff4d6d;--blue:#60a5fa;--accent:#f97316;--accent2:#fdba74;--green:#facc15}
html[data-theme=neon]{--bg:#05020d;--bg2:#11102a;--red:#ff2a6d;--blue:#05d9e8;--accent:#d300c5;--accent2:#ff6ec7;--green:#00ff9f}
html[data-theme=forest]{--bg:#04110b;--bg2:#0b1c14;--red:#fb7185;--blue:#7dd3fc;--accent:#34d399;--accent2:#a7f3d0;--green:#bef264}
html[data-theme=royal]{--bg:#09051c;--bg2:#161033;--red:#f43f5e;--blue:#7dd3fc;--accent:#c084fc;--accent2:#e9d5ff}
html[data-theme=voltage]{--bg:#060b10;--bg2:#0c1724;--red:#ff2367;--blue:#00e5ff;--accent:#ffe45e;--accent2:#fff3a0;--green:#00ff9d}
html[data-theme=cosmic]{--bg:#05060b;--bg2:#0b1020;--accent:#f7bd56;--accent2:#ffdc87;--blue:#73ddff;--violet:#c7a3ff;--green:#62eaa7}
html[data-theme=paper],html[data-theme=light],html[data-theme=desert],html[data-theme=porcelain]{
  color-scheme:light;--bg:#f7f9fd;--bg2:#eef3fb;--bg3:#e8eef9;
  --panel:rgba(255,255,255,.9);--panel2:#fff;--panel3:rgba(15,23,42,.045);
  --line:rgba(15,23,42,.13);--line2:rgba(15,23,42,.26);
  --text:#111827;--muted:#64748b;--soft:#334155;
  --red:#e11d48;--blue:#0284c7;--accent:#6d28d9;--accent2:#8b5cf6;--violet:#7c3aed;--green:#059669;
  --shadow:0 22px 70px rgba(15,23,42,.14);--glow:0 0 28px rgba(109,40,217,.12)
}
html[data-theme=desert]{--bg:#fbf1df;--bg2:#f4dfbe;--red:#c2410c;--blue:#0369a1;--accent:#a16207;--accent2:#ca8a04;--green:#15803d}
html[data-theme=paper]{--bg:#fbfaf6;--bg2:#f1eee6;--panel:rgba(255,253,250,.95);--red:#b91c1c;--blue:#1d4ed8;--accent:#4f46e5;--accent2:#6366f1;--green:#047857}
html[data-theme=porcelain]{--bg:#f7f2e8;--bg2:#fffdf8;--accent:#9a6bff;--accent2:#b794ff;--blue:#0d8fb8;--green:#158f5b}

html[data-density=compact]{--pad:13px;--gap:9px;--r:14px;--r2:10px}
html[data-density=spacious]{--pad:28px;--gap:20px;--r:26px;--r2:18px}
html[data-motion=none] *,html[data-motion=none] *:before,html[data-motion=none] *:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
html[data-motion=reduced] *{transition-duration:.08s!important;animation-duration:.01s!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}

*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
  background:
    radial-gradient(circle at 14% -12%, color-mix(in srgb,var(--accent) 22%, transparent), transparent 32%),
    radial-gradient(circle at 86% -4%, color-mix(in srgb,var(--blue) 20%, transparent), transparent 36%),
    radial-gradient(circle at 48% 112%, color-mix(in srgb,var(--violet) 16%, transparent), transparent 34%),
    linear-gradient(140deg,var(--bg),var(--bg2) 54%,var(--bg));
  background-attachment:fixed;
  color:var(--text);font-family:var(--font);font-size:var(--fs);line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
a{color:var(--blue)}
::selection{background:color-mix(in srgb,var(--accent) 40%,transparent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
.hide{display:none!important}
.mono{font-family:var(--mono);font-size:.88em}
.subtle{color:var(--muted);font-size:12px;margin:0}
.nowrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- layout ---------- */
.app{min-height:100dvh;display:grid;grid-template-columns:272px minmax(0,1fr)}
.rail{position:sticky;top:0;height:100dvh;padding:16px 12px;border-right:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(var(--blur));overflow:auto;z-index:20}
.stage{padding:var(--pad);max-width:var(--maxw);margin:0 auto;width:100%;display:grid;gap:var(--gap);align-content:start}
.brand{display:flex;align-items:center;gap:11px;padding:8px 8px 16px}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--blue));
  display:grid;place-items:center;font-weight:900;letter-spacing:-.08em;color:#08101c;box-shadow:var(--glow);
  position:relative;overflow:hidden;flex:0 0 auto;font-size:15px}
.logo:after{content:"";position:absolute;inset:-40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:rotate(24deg) translateX(-80%);animation:sheen 6s infinite}
@keyframes sheen{58%,100%{transform:rotate(24deg) translateX(110%)}}
.brand h1{font-size:15px;margin:0;letter-spacing:-.03em;line-height:1.1}
.brand p{margin:3px 0 0;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.15em}
.nav{display:grid;gap:5px}
.nav button{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:12px;color:var(--muted);text-align:left;width:100%;transition:background .15s,color .15s}
.nav button:hover{background:var(--panel3);color:var(--text)}
.nav button.active{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 20%,transparent),color-mix(in srgb,var(--blue) 15%,transparent));color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.nav .glyph{width:18px;text-align:center;flex:0 0 auto}
.nav .count{margin-left:auto;font-size:10px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.rail-section{margin:16px 6px 0}
.rail-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;margin:0 0 7px}
.status-pill{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:var(--muted);font-size:11.5px;background:var(--panel3);margin-bottom:8px}
.dot{width:8px;height:8px;border-radius:99px;flex:0 0 auto;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 22%,transparent)}
.dot.ok{background:var(--green);color:var(--green)}
.dot.warn{background:var(--amber);color:var(--amber)}
.dot.bad{background:var(--danger);color:var(--danger)}
.dot.busy{background:var(--blue);color:var(--blue);animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.35}}
.rail-kpis{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rail-kpis div{border:1px solid var(--line);border-radius:11px;padding:8px 9px;background:var(--panel3)}
.rail-kpis b{display:block;font-size:15px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rail-kpis span{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}

/* ---------- primitives ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);box-shadow:var(--shadow);backdrop-filter:blur(var(--blur));min-width:0}
.panel>h3{margin:0 0 4px;font-size:15px;letter-spacing:-.02em}
.panel>p.lede{margin:0 0 14px;color:var(--muted);font-size:12.5px;max-width:92ch}
.panel-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.panel-title h3{margin:0;font-size:15px;letter-spacing:-.02em}
.panel-title p{margin:3px 0 0;color:var(--muted);font-size:12px}
.grid{display:grid;gap:var(--gap)}
.cols2{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.cols3{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.cols4{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}
label{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:5px}
input,select,textarea{width:100%;background:var(--panel3);border:1px solid var(--line);border-radius:var(--r3);padding:9px 11px;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
textarea{resize:vertical;min-height:70px;line-height:1.55}
select{cursor:pointer}
input[type=range]{padding:0;background:transparent;border:0;accent-color:var(--accent)}
input[type=color]{padding:2px;height:38px;cursor:pointer}
input[type=checkbox]{width:auto;accent-color:var(--accent);cursor:pointer}
.check{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text);text-transform:none;letter-spacing:0;border:1px solid var(--line);border-radius:var(--r3);padding:9px 11px;background:var(--panel3);cursor:pointer;margin:0}
.check input{flex:0 0 auto}
.field{min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:var(--r3);
  border:1px solid var(--line2);background:var(--panel3);color:var(--text);font-weight:650;font-size:13px;
  transition:transform .12s,border-color .12s,background .12s,box-shadow .12s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b0f18;border-color:transparent;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 24%,transparent)}
.btn.danger{background:color-mix(in srgb,var(--danger) 16%,transparent);border-color:color-mix(in srgb,var(--danger) 50%,transparent);color:var(--text)}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.small{padding:6px 10px;font-size:11.5px;border-radius:9px}
.btn.tiny{padding:4px 8px;font-size:10.5px;border-radius:8px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:99px;
  border:1px solid var(--line2);color:var(--muted);background:var(--panel3);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.pill.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,transparent);background:color-mix(in srgb,var(--green) 12%,transparent)}
.pill.warn{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent);background:color-mix(in srgb,var(--amber) 12%,transparent)}
.pill.bad{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent);background:color-mix(in srgb,var(--danger) 12%,transparent)}
.pill.info{color:var(--blue);border-color:color-mix(in srgb,var(--blue) 45%,transparent);background:color-mix(in srgb,var(--blue) 12%,transparent)}
.pill.accent{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:99px;border:1px solid var(--line);background:var(--panel3);font-size:11.5px;color:var(--muted);transition:all .13s;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.active{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 26%,transparent),color-mix(in srgb,var(--blue) 18%,transparent));color:var(--text);border-color:var(--line2)}
.hr{height:1px;background:var(--line);margin:14px 0;border:0}
.empty{border:1px dashed var(--line2);border-radius:var(--r2);padding:26px 18px;text-align:center;color:var(--muted);font-size:12.5px}
.scroll{overflow:auto;max-height:340px;display:grid;gap:8px;padding-right:3px}

/* ---------- hero ---------- */
.hero{border:1px solid var(--line);border-radius:var(--r);padding:20px var(--pad);position:relative;overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 13%,transparent),color-mix(in srgb,var(--blue) 10%,transparent)),var(--panel);
  backdrop-filter:blur(var(--blur));box-shadow:var(--shadow)}
.hero h2{margin:0;font-size:21px;letter-spacing:-.035em}
.hero p{margin:6px 0 0;color:var(--muted);font-size:13px;max-width:80ch}
.hero-inner{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bars{display:flex;gap:5px;align-items:flex-end;height:44px}
.bars i{width:6px;border-radius:99px;background:linear-gradient(180deg,var(--accent),var(--blue));animation:bar 1.9s ease-in-out infinite}
.bars i:nth-child(1){height:40%;animation-delay:0s}.bars i:nth-child(2){height:72%;animation-delay:.16s}
.bars i:nth-child(3){height:52%;animation-delay:.32s}.bars i:nth-child(4){height:92%;animation-delay:.48s}
.bars i:nth-child(5){height:60%;animation-delay:.64s}
@keyframes bar{50%{transform:scaleY(.42)}}

/* ---------- metrics ---------- */
.metrics{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(112px,1fr))}
.metric{border:1px solid var(--line);border-radius:var(--r2);padding:12px;background:var(--panel);text-align:left;backdrop-filter:blur(var(--blur))}
.metric b{display:block;font-size:20px;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1.1}
.metric span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.progress{height:6px;border-radius:99px;background:var(--panel3);overflow:hidden;border:1px solid var(--line)}
.progress>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--blue));transition:width .4s ease;border-radius:99px}

/* ---------- chat ---------- */
.chat-layout{display:grid;grid-template-columns:minmax(0,1fr) 336px;gap:var(--gap);align-items:start}
@media(max-width:1180px){.chat-layout{grid-template-columns:minmax(0,1fr)}}
.chat-shell{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;
  min-height:60dvh;overflow:hidden;box-shadow:var(--shadow);backdrop-filter:blur(var(--blur))}
.messages{flex:1;overflow:auto;padding:var(--pad);display:grid;gap:14px;align-content:start;max-height:64dvh;scroll-behavior:smooth}
.msg{display:grid;gap:5px;max-width:min(94%,980px)}
.msg.user{justify-self:end;text-align:right}
.msg-meta{display:flex;gap:9px;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;align-items:center;flex-wrap:wrap}
.msg.user .msg-meta{justify-content:flex-end}
.bubble{border:1px solid var(--line);border-radius:var(--r2);padding:13px 15px;background:var(--panel3);text-align:left;overflow-wrap:anywhere}
.msg.user .bubble{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 20%,transparent),color-mix(in srgb,var(--blue) 14%,transparent));border-color:var(--line2)}
.msg.tool .bubble{border-style:dashed;background:transparent}
.bubble h2{font-size:16px;margin:14px 0 6px;letter-spacing:-.02em}
.bubble h3{font-size:14px;margin:12px 0 5px;color:var(--accent)}
.bubble>*:first-child{margin-top:0}
.bubble ul{margin:6px 0;padding-left:20px}
.bubble li{margin:2px 0}
.bubble table{border-collapse:collapse;width:100%;margin:8px 0;font-size:12.5px}
.bubble th,.bubble td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.bubble th{background:var(--panel3);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.codebox{border:1px solid var(--line);border-radius:var(--r3);overflow:hidden;margin:10px 0;background:var(--panel2)}
.codebox .msg-meta{padding:6px 10px;border-bottom:1px solid var(--line);justify-content:space-between;margin:0}
.codebox pre{margin:0;padding:12px;overflow:auto;max-height:420px;font-family:var(--mono);font-size:12px;line-height:1.55}
.composer{border-top:1px solid var(--line);padding:12px var(--pad);display:grid;gap:9px;background:var(--panel2)}
.composer textarea{min-height:82px;max-height:280px;background:var(--panel3)}
.composer-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.side-panel{display:grid;gap:var(--gap);align-content:start;position:sticky;top:var(--pad)}
.mini-card{border:1px solid var(--line);border-radius:var(--r2);padding:13px;background:var(--panel);backdrop-filter:blur(var(--blur))}
.mini-card h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted)}
.mini-card p{margin:0;font-size:12.5px}
.typing{display:inline-flex;gap:3px;align-items:center}
.typing i{width:5px;height:5px;border-radius:99px;background:var(--accent);animation:pulse 1s infinite}
.typing i:nth-child(2){animation-delay:.16s}.typing i:nth-child(3){animation-delay:.32s}

/* ---------- swarm ---------- */
.agent-card{border:1px solid var(--line);border-radius:var(--r2);background:var(--panel);overflow:hidden;transition:border-color .15s}
.agent-card.running{border-color:color-mix(in srgb,var(--blue) 55%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--blue) 22%,transparent)}
.agent-card.done{border-color:color-mix(in srgb,var(--green) 45%,transparent)}
.agent-card.failed{border-color:color-mix(in srgb,var(--danger) 50%,transparent)}
.agent-card>header{display:flex;gap:10px;align-items:center;padding:11px 13px;cursor:pointer;background:var(--panel3)}
.agent-card>header:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.agent-card h4{margin:0;font-size:12.5px;letter-spacing:-.01em}
.agent-card header p{margin:2px 0 0;font-size:10.5px;color:var(--muted)}
.agent-card .body{display:none;padding:12px 13px;border-top:1px solid var(--line)}
.agent-card.open .body{display:block}
.agent-card pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--mono);font-size:11.5px;max-height:460px;overflow:auto;line-height:1.55}
.swarm-map{border:1px solid var(--line);border-radius:var(--r2);background:var(--panel2);padding:12px;min-height:220px;position:relative;overflow:auto}
.swarm-node{display:flex;gap:9px;align-items:center;padding:8px 11px;border:1px solid var(--line);border-radius:99px;background:var(--panel3);font-size:12px}
.lane{display:grid;gap:8px}
.lane-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}

/* ---------- Definition of Done ---------- */
.dod{border:1px solid color-mix(in srgb,var(--accent) 42%,transparent);border-radius:var(--r2);
  background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 9%,transparent),transparent);padding:14px;margin:12px 0}
.dod>h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:var(--accent);display:flex;gap:8px;align-items:center}
.dod .objective{margin:0 0 11px;font-size:13px;color:var(--text)}
.dod-item{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:9px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.dod-item:first-of-type{border-top:0}
.dod-mark{width:20px;height:20px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:900;flex:0 0 auto;margin-top:1px}
.dod-mark.met{background:color-mix(in srgb,var(--green) 22%,transparent);color:var(--green);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--green) 50%,transparent)}
.dod-mark.unmet{background:color-mix(in srgb,var(--danger) 20%,transparent);color:var(--danger);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--danger) 50%,transparent)}
.dod-mark.partial{background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--amber);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--amber) 50%,transparent)}
.dod-mark.pending{background:var(--panel3);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.dod-text{font-size:12.5px;min-width:0}
.dod-text b{display:block;font-weight:650;margin-bottom:2px}
.dod-text span{color:var(--muted);font-size:11.5px;display:block}
.dod-foot{margin-top:11px;padding-top:11px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ---------- tables / lists ---------- */
.rows{display:grid;gap:7px}
.rowitem{display:flex;gap:11px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r3);background:var(--panel3);min-width:0}
.rowitem .ico{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);flex:0 0 auto;font-size:13px}
.rowitem .info{flex:1;min-width:0}
.rowitem b{display:block;font-size:12.5px;font-weight:650}
.rowitem p{margin:1px 0 0;font-size:10.5px;color:var(--muted)}
table.data{width:100%;border-collapse:collapse;font-size:12.5px}
table.data th,table.data td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.data th{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
table.data tr:hover td{background:var(--panel3)}

/* ---------- feature / model cards ---------- */
.card-grid{display:grid;gap:var(--gap);grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.fcard{border:1px solid var(--line);border-radius:var(--r2);padding:14px;background:var(--panel);display:grid;gap:9px;align-content:start;transition:transform .14s,border-color .14s;backdrop-filter:blur(var(--blur))}
.fcard:hover{transform:translateY(-2px);border-color:var(--line2)}
.fcard .top{display:flex;gap:10px;align-items:flex-start}
.fcard .ficon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px;background:var(--panel3);border:1px solid var(--line);flex:0 0 auto}
.fcard h4{margin:0;font-size:13.5px;letter-spacing:-.015em}
.fcard .fdesc{margin:2px 0 0;font-size:11.5px;color:var(--muted)}
.fcard textarea{min-height:76px;font-size:12.5px}
.fcard .out{border:1px solid var(--line);border-radius:var(--r3);padding:11px;background:var(--panel2);font-size:12px;max-height:380px;overflow:auto;display:none}
.fcard .out.show{display:block}
.model-tile{border:1px solid var(--line);border-radius:var(--r2);padding:13px;background:var(--panel);display:grid;gap:7px;align-content:start;cursor:pointer;transition:transform .14s,border-color .14s}
.model-tile:hover{transform:translateY(-2px);border-color:var(--accent)}
.model-tile.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.model-tile h4{margin:0;font-size:12.5px;overflow-wrap:anywhere}
.model-tile .meta{font-size:10.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}

/* ---------- preview ---------- */
.preview-frame{width:100%;border:1px solid var(--line);border-radius:var(--r3);background:#fff;min-height:200px}
canvas.viz{width:100%;height:340px;display:block;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel2)}
canvas.spark{width:100%;height:140px;display:block;border:1px solid var(--line);border-radius:var(--r2);background:var(--panel2)}

/* ---------- palette / studio ---------- */
.palette{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.color-control{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:var(--r3);padding:8px;background:var(--panel3)}
.color-control input[type=color]{width:42px;flex:0 0 auto}
.color-control .field{flex:1;min-width:0}
.color-control label{margin-bottom:3px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.swatch{display:flex;gap:7px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:5px 11px 5px 6px;background:var(--panel3);font-size:11.5px}
.swatch b{width:20px;height:20px;border-radius:99px;display:block}
.swatch.active{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}

/* ---------- command palette ---------- */
.cmdk{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);z-index:200;display:none;padding-top:12vh;justify-content:center}
.cmdk.show{display:flex}
.cmdk-box{width:min(640px,92vw);height:fit-content;max-height:70vh;background:var(--panel2);border:1px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.cmdk-box input{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 18px;font-size:15px;background:transparent}
.cmdk-box input:focus{box-shadow:none;border-color:var(--line)}
.cmdk-list{overflow:auto;padding:7px}
.cmdk-item{display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:var(--r3);cursor:pointer;font-size:13px;width:100%;text-align:left}
.cmdk-item:hover,.cmdk-item.sel{background:color-mix(in srgb,var(--accent) 15%,transparent)}
.cmdk-item span.k{margin-left:auto;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

/* ---------- toast + misc ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,24px);background:var(--panel2);color:var(--text);
  border:1px solid var(--line2);border-radius:99px;padding:11px 20px;box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transition:opacity .22s,transform .22s;z-index:300;font-size:13px;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.banner{border:1px solid var(--line2);border-radius:var(--r2);padding:12px 14px;background:var(--panel3);font-size:12.5px;display:flex;gap:11px;align-items:flex-start}
.banner.warn{border-color:color-mix(in srgb,var(--amber) 45%,transparent);background:color-mix(in srgb,var(--amber) 9%,transparent)}
.banner.bad{border-color:color-mix(in srgb,var(--danger) 45%,transparent);background:color-mix(in srgb,var(--danger) 9%,transparent)}
.banner.ok{border-color:color-mix(in srgb,var(--green) 45%,transparent);background:color-mix(in srgb,var(--green) 9%,transparent)}
.mobile-nav{display:none}

@media(max-width:940px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .rail .nav{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));display:grid}
  .stage{padding:14px 12px 88px}
  .side-panel{position:static}
  .messages{max-height:none}
  .mobile-nav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:90;background:var(--panel2);
    border-top:1px solid var(--line);backdrop-filter:blur(var(--blur));padding:7px 6px;gap:3px;justify-content:space-around}
  .mobile-nav button{flex:1;display:grid;gap:2px;justify-items:center;font-size:9.5px;color:var(--muted);padding:6px 2px;border-radius:10px}
  .mobile-nav button.active{color:var(--accent);background:var(--panel3)}
  .mobile-nav .glyph{font-size:16px}
}
/* ---------- simple layout ----------
   One column, one box. The advanced console is one keystroke away, so nothing
   here needs to compete for room with it. */
body[data-layout=simple] .mobile-nav{display:none!important}
.simple{min-height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-width:900px;margin:0 auto;width:100%;min-width:0;overflow-x:hidden}
.simple-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px;
  border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 84%,transparent);
  backdrop-filter:blur(var(--blur));position:sticky;top:0;z-index:20}
.simple-model{max-width:230px;font-size:12px;padding:6px 9px}
.simple-main{overflow-y:auto;overflow-x:hidden;padding:26px 18px 10px;display:grid;gap:18px;align-content:start;min-width:0}
.simple-main>*{min-width:0;max-width:100%}
.simple-hero{text-align:center;padding:8vh 0 4vh;display:grid;gap:14px;justify-items:center;min-width:0;max-width:100%}
.simple-hero h1{font-size:clamp(23px,4.4vw,34px);margin:0;letter-spacing:-.04em;line-height:1.15}
.simple-hero p{margin:0;color:var(--muted);max-width:min(56ch,100%);font-size:14px}
.simple-suggest{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(215px,100%),1fr));gap:10px;margin-top:14px;width:100%;max-width:min(700px,100%);min-width:0}
.simple-card{border:1px solid var(--line);border-radius:var(--r2);padding:13px 15px;background:var(--panel);
  text-align:left;display:grid;gap:4px;transition:transform .14s,border-color .14s}
.simple-card:hover{transform:translateY(-2px);border-color:var(--accent)}
.simple-card{min-width:0}
.simple-card b{font-size:13px;overflow-wrap:anywhere}
.simple-card span{font-size:11.5px;color:var(--muted);line-height:1.45;overflow-wrap:anywhere}
.simple-composer{padding:10px 18px 18px;background:linear-gradient(180deg,transparent,var(--bg) 26%);position:sticky;bottom:0}
.simple-input{display:flex;align-items:flex-end;gap:9px;border:1px solid var(--line2);border-radius:26px;
  padding:9px 9px 9px 18px;background:var(--panel2);box-shadow:var(--shadow);transition:border-color .15s}
.simple-input:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent),var(--shadow)}
.simple-input textarea{flex:1;border:0;background:transparent;padding:7px 0;resize:none;max-height:210px;
  min-height:26px;font-size:15px;line-height:1.5;outline:none}
.simple-input textarea:focus{box-shadow:none;border:0}
.simple-actions{display:flex;gap:5px;align-items:center;flex:0 0 auto}
.icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;
  border:1px solid transparent;color:var(--muted);transition:all .14s}
.icon-btn:hover{background:var(--panel3);color:var(--text)}
.icon-btn.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.icon-btn.send{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0b0f18;font-weight:900}
.icon-btn.send:hover{transform:scale(1.06)}
.icon-btn.stop{background:color-mix(in srgb,var(--danger) 22%,transparent);color:var(--text);border-color:color-mix(in srgb,var(--danger) 55%,transparent)}
.simple-foot{margin:8px 4px 0;font-size:11px;color:var(--faint);text-align:center}
.working-strip{display:flex;align-items:center;gap:10px;margin:0 18px;padding:9px 13px;border:1px solid var(--line);
  border-radius:99px;background:var(--panel);font-size:12px;backdrop-filter:blur(var(--blur))}
.strip-chips{display:flex;gap:4px}
.strip-chip{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:10px;
  border:1px solid var(--line);background:var(--panel3)}
.strip-chip.done{border-color:color-mix(in srgb,var(--green) 55%,transparent)}
.strip-chip.running{border-color:color-mix(in srgb,var(--blue) 60%,transparent);animation:pulse 1.2s infinite}
.strip-chip.failed{border-color:color-mix(in srgb,var(--danger) 55%,transparent)}
body[data-layout=simple] .msg{max-width:100%}
@media(max-width:700px){
  .simple-bar{padding:10px 12px}.simple-main{padding:18px 12px 8px}
  .simple-composer{padding:8px 12px 14px}.simple-model{max-width:140px}
  .working-strip{margin:0 12px}
}
@media print{.rail,.composer,.mobile-nav,.toast,.simple-bar,.simple-composer{display:none!important}.app{grid-template-columns:1fr}}

/* ---- Live artifact dock. Lives outside #app so re-renders never reload it. */
:root{--dock-w:min(46vw,880px)}
body.dock-open #app,body.dock-open #mobileNav{margin-right:var(--dock-w)}
body.dock-resizing,body.dock-resizing *{cursor:col-resize!important;user-select:none}
body.dock-resizing .dock-frame{pointer-events:none}
.dock{position:fixed;top:0;right:0;bottom:0;width:var(--dock-w);z-index:60;display:flex;flex-direction:column;background:var(--panel2);border-left:1px solid var(--line2);box-shadow:-18px 0 60px rgba(0,0,0,.35);backdrop-filter:blur(var(--blur))}
.dock[hidden]{display:none}
.dock.full{left:0;width:auto;z-index:90}
.dock-grip{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:2}
.dock.full .dock-grip{display:none}
.dock-head{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.dock-tabs{display:flex;gap:6px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:thin}
.dock-tab{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;font:600 12px var(--font);color:var(--soft);background:var(--panel3);border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer}
.dock-tab.active{color:var(--text);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
.dock-tab .dot,.dock-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.dock-tab .dot.busy,.dock-pill .dot.busy{background:var(--accent);animation:dockPulse 1s infinite}
@keyframes dockPulse{50%{opacity:.25}}
.dock-tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dock-tools select{width:auto;padding:5px 8px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);font:700 12px var(--font);padding:6px 11px;cursor:pointer}
.seg button.active{background:var(--accent);color:#111}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.dock-status{padding:7px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);min-height:32px}
.dock-status .writing{color:var(--accent)}
.dock-error{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 14px;background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--text);font-size:12.5px;border-bottom:1px solid var(--line)}
.dock-error[hidden]{display:none}
.dock-body{position:relative;flex:1;min-height:0;display:flex}
.dock-frame{flex:1;width:100%;height:100%;border:0;background:#fff}
.dock-frame[hidden],.dock-code[hidden],.dock-empty[hidden]{display:none}
.dock-code{flex:1;margin:0;overflow:auto;padding:14px 16px;font:12.5px/1.55 var(--mono);color:var(--soft);background:rgba(0,0,0,.28);white-space:pre;tab-size:2}
.dock-empty{margin:auto;max-width:360px;text-align:center;color:var(--muted);padding:30px;font-size:13.5px}
.dock-pill{position:fixed;right:16px;bottom:18px;z-index:70;display:inline-flex;gap:8px;align-items:center;font:700 12.5px var(--font);color:var(--text);background:var(--panel2);border:1px solid var(--line2);border-radius:999px;padding:10px 15px;box-shadow:var(--shadow);cursor:pointer;max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dock-pill[hidden]{display:none}
.art-card{display:flex;align-items:center;gap:12px;width:100%;max-width:520px;margin:10px 0;padding:11px 14px;text-align:left;color:var(--text);background:var(--panel3);border:1px solid var(--line2);border-radius:var(--r2);cursor:pointer;font:inherit}
.art-card:hover{border-color:var(--accent)}
.art-card.writing{border-color:var(--accent);box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.art-card .art-ico{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);font-weight:800;flex:none}
.art-card .art-txt{display:flex;flex-direction:column;min-width:0;flex:1}
.art-card .art-txt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.art-card .art-txt span{font-size:12px;color:var(--muted)}
.art-card .art-go{font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}
@media (max-width:899px){.dock{left:0;width:auto}.dock-pill{bottom:84px}}

/* ---- chats drawer, message actions, runner, slash menu */
.chats-scrim{position:fixed;inset:0;z-index:74;background:rgba(0,0,0,.35)}
.chats-drawer{position:fixed;top:0;left:0;bottom:0;width:min(340px,88vw);z-index:75;display:flex;flex-direction:column;background:var(--panel2);border-right:1px solid var(--line2);box-shadow:18px 0 60px rgba(0,0,0,.4);backdrop-filter:blur(var(--blur))}
.chats-head{display:flex;justify-content:space-between;align-items:center;padding:14px 12px 10px;font-size:15px}
.chats-list{flex:1;overflow:auto;padding:0 8px 12px}
.chat-group{margin:6px 0 10px}.chat-group-h,.chat-group summary{font:700 11px var(--font);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:6px 6px;cursor:default}
.chat-group summary{cursor:pointer}
.chat-row{display:flex;align-items:center;gap:4px;border-radius:10px;padding:2px 4px}
.chat-row:hover,.chat-row.active{background:var(--panel3)}
.chat-row.active{outline:1px solid var(--line2)}
.chat-open{flex:1;min-width:0;text-align:left;background:none;border:0;color:var(--soft);font:500 13px var(--font);padding:7px 6px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-row.active .chat-open{color:var(--text)}
.chat-acts{display:flex;gap:1px;opacity:0;transition:opacity .15s}
.chat-row:hover .chat-acts,.chat-row.active .chat-acts{opacity:1}
@media (hover:none){.chat-acts{opacity:1}}
.chat-acts button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:12px;padding:4px 4px;border-radius:6px}
.chat-acts button:hover{color:var(--text);background:var(--panel3)}
.chat-row.editing input{flex:1;padding:6px 8px;font-size:13px}
.chat-export{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:4px 10px 8px}
.chat-export button{background:var(--panel3);border:1px solid var(--line);color:var(--soft);border-radius:8px;padding:3px 8px;font-size:12px;cursor:pointer}
.chats-foot{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.msg-actions{display:flex;gap:2px;align-items:center;flex-wrap:wrap;margin-top:4px;opacity:.55;transition:opacity .15s}
.msg:hover .msg-actions,.msg-actions:focus-within{opacity:1}
@media (hover:none){.msg-actions{opacity:.85}}
.msg.user .msg-actions{justify-content:flex-end}
.msg-actions button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:4px 6px;border-radius:7px;line-height:1}

#!/usr/bin/env node
/*
 * SWARM OS BRIDGE
 * A small companion for the SWARM OS web app. Zero dependencies, Node 18+.
 *
 *   node swarm-bridge.mjs
 *
 * It does four jobs a web page cannot do for itself:
 *
 *   1. Reaches providers that refuse browser requests. api.z.ai, Cerebras,
 *      Tavily and Moonshot's Anthropic surface all reject cross-origin calls.
 *      This forwards them.
 *   2. Finds the credentials your CLIs already have, and uses them WITHOUT
 *      handing them to the browser. The page asks for "zai"; the key is
 *      attached here and never crosses into the tab. A credential is only ever
 *      attached to its own provider's hosts.
 *   3. Runs your installed coding CLIs as swarm agents. Kimi Code CLI, Claude
 *      Code, Codex, Gemini CLI and Continue CLI each get spawned in their own
 *      headless print mode, so work runs on your subscription and your auth.
 *   4. Reads your Continue setup. Models and keys you configured in
 *      ~/.continue/config.yaml become swarm agents, and every local model server
 *      Continue knows how to talk to (Ollama, LM Studio, llama.cpp, Msty,
 *      Lemonade, Jan, Docker Model Runner, text-generation-webui) is detected —
 *      the zero-cost, no-quota route.
 *
 * Security posture, deliberately narrow:
 *   - binds 127.0.0.1 only, never a public interface
 *   - every API request must carry the pairing token printed at startup
 *   - the Host header must name this loopback listener (DNS-rebinding guard)
 *   - upstream hosts are allow-listed; anything else is refused
 *   - credential values are never returned to the browser, only their names
 *   - spawning a CLI is OFF until you pass --allow-cli
 *   - nothing is installed, updated or launched without you asking
 *
 * Flags:
 *   --port <n>        default 8787
 *   --token <s>       use a fixed token instead of a random one
 *   --allow-cli       permit spawning local coding CLIs as agents
 *   --allow-sandbox   permit disposable sandboxes that can run commands
 *   --sandbox-root <d>  where sandboxes live (default ~/.swarm-os/sandboxes)
 *   --skills-dir <d>  where SWARM OS writes skills (default ~/.swarm-os/skills)
 *   --allow-host <h>  add one extra upstream host (repeatable)
 *   --serve-app <f>   also serve this HTML file at / (same origin as the API)
 *
 * Embedding (the macOS app does this):
 *   import { startBridge } from "./swarm-bridge.mjs";
 *   const b = await startBridge({ port, token, allowCli, env });
 *   ...; await b.close();
 */

import http from "node:http";
import https from "node:https";
import fs from "node:fs";
import path from "node:path";
import os from "node:os";
import crypto from "node:crypto";
import { spawn } from "node:child_process";
import { fileURLToPath } from "node:url";

export const VERSION = "1.1.0";

export const DEFAULT_ALLOWED_HOSTS = [
  "openrouter.ai", "api.z.ai", "open.bigmodel.cn",
  "api.moonshot.ai", "api.kimi.com",
  "api.anthropic.com", "api.openai.com", "generativelanguage.googleapis.com",
  "api.deepseek.com", "api.groq.com", "api.mistral.ai", "api.x.ai",
  "api.together.xyz", "api.cerebras.ai", "api.fireworks.ai",
  "api.typesafe.ai",
  "api.tavily.com", "api.exa.ai", "api.firecrawl.dev", "google.serper.dev",
  "api.search.brave.com", "r.jina.ai",
  "127.0.0.1", "localhost"
];

/* Which hosts each credential may be sent to. A key found for one provider is
   never attached to a request bound for another, even an allow-listed one. */
export const CREDENTIAL_HOSTS = {
  openrouter: ["openrouter.ai"],
  openai: ["api.openai.com"],
  anthropic: ["api.anthropic.com"],
  google: ["generativelanguage.googleapis.com"],
  deepseek: ["api.deepseek.com"],
  groq: ["api.groq.com"],
  mistral: ["api.mistral.ai"],
  xai: ["api.x.ai"],
  together: ["api.together.xyz"],
  cerebras: ["api.cerebras.ai"],
  fireworks: ["api.fireworks.ai"],
  zai: ["api.z.ai", "open.bigmodel.cn"],
  moonshot: ["api.moonshot.ai", "api.kimi.com"],
  jev: ["api.typesafe.ai"],
  tavily: ["api.tavily.com"],
  exa: ["api.exa.ai"],
  firecrawl: ["api.firecrawl.dev"],
  serper: ["google.serper.dev"],
  brave: ["api.search.brave.com"]
};

/* ------------------------------------------------------------- utilities */
const readJson = (p) => { try { return JSON.parse(fs.readFileSync(p, "utf8")); } catch { return null; } };
const readText = (p) => { try { return fs.readFileSync(p, "utf8"); } catch { return ""; } };
const exists = (p) => { try { fs.accessSync(p); return true; } catch { return false; } };
export const redact = (v) => {
  if (!v) return "";
  const s = String(v);
  return s.length <= 10 ? "****" : s.slice(0, 5) + "…" + s.slice(-4);
};
/* Substitute a {placeholder} literally. String.prototype.replace with a string
   argument would expand "$&", "$'" and friends inside the user's prompt. */
export const fill = (template, key, value) => String(template).split("{" + key + "}").join(String(value));

// Enough TOML for the flat "key = value" lines these configs actually use.
export function tinyToml(text) {
  const out = {};
  let section = "";
  for (const raw of String(text || "").split("\n")) {
    const line = raw.trim();
    if (!line || line.startsWith("#")) continue;
    const sec = line.match(/^\[([^\]]+)\]$/);
    if (sec) { section = sec[1]; continue; }
    const kv = line.match(/^([A-Za-z0-9_.-]+)\s*=\s*(.+)$/);
    if (!kv) continue;
    let v = kv[2].trim().replace(/^["']|["']$/g, "");
    out[(section ? section + "." : "") + kv[1]] = v;
  }
  return out;
}

/* Enough YAML for a Continue config.yaml: block maps, block lists, inline
   [a, b] lists, quoted and plain scalars, comments. Anchors, multi-line
   scalars and flow maps are skipped rather than guessed at. */
export function tinyYaml(text) {
  const lines = [];
  for (const raw of String(text || "").replace(/\r/g, "").split("\n")) {
    const noComment = stripYamlComment(raw);
    if (!noComment.trim() || noComment.trim() === "---") continue;
    lines.push({ indent: noComment.match(/^ */)[0].length, text: noComment.trim() });
  }
  let i = 0;
  const isItem = (t) => t === "-" || t.startsWith("- ");
  function scalar(s) {
    s = s.trim();
    if (s === "" || s === "~" || s === "null") return null;
    if ((s.startsWith('"') && s.endsWith('"')) || (s.startsWith("'") && s.endsWith("'"))) return s.slice(1, -1);
    if (s.startsWith("[") && s.endsWith("]")) return s.slice(1, -1).split(",").map((x) => scalar(x)).filter((x) => x !== null);
    if (s === "true") return true;
    if (s === "false") return false;
    if (/^-?\d+(\.\d+)?$/.test(s)) return Number(s);
    return s;
  }
  function block(indent) {
    if (i >= lines.length) return null;
    return isItem(lines[i].text) ? list(lines[i].indent) : map(indent);
  }
  function map(indent) {
    const out = {};
    while (i < lines.length && lines[i].indent === indent && !isItem(lines[i].text)) {
      const m = lines[i].text.match(/^("[^"]*"|'[^']*'|[^:]+?)\s*:(?:\s+(.*))?$/);
      i++;
      if (!m) continue;
      const key = String(scalar(m[1]));
      const rest = m[2];
      if (rest !== undefined && rest !== "") { out[key] = scalar(rest); continue; }
      if (i < lines.length && lines[i].indent > indent) out[key] = block(lines[i].indent);
      else if (i < lines.length && lines[i].indent === indent && isItem(lines[i].text)) out[key] = list(indent);
      else out[key] = null;
    }
    return out;
  }
  function list(indent) {
    const out = [];
    while (i < lines.length && lines[i].indent === indent && isItem(lines[i].text)) {
      const after = lines[i].text.slice(1).trimStart();
      if (!after) { i++; out.push(i < lines.length && lines[i].indent > indent ? block(lines[i].indent) : null); continue; }
      if (!after.startsWith("[") && /^("[^"]*"|'[^']*'|[^:\s][^:]*?)\s*:(\s|$)/.test(after)) {
        // "- key: value" opens a map whose further keys sit one column past the dash.
        const childIndent = indent + (lines[i].text.length - after.length);
        lines[i] = { indent: childIndent, text: after };
        out.push(map(childIndent));
      } else {
        out.push(scalar(after));
        i++;
      }
    }
    return out;
  }
  return lines.length ? block(lines[0].indent) : null;
}
function stripYamlComment(line) {
  let q = null;
  for (let k = 0; k < line.length; k++) {
    const c = line[k];
    if (q) { if (c === q) q = null; continue; }
    if (c === '"' || c === "'") q = c;
    else if (c === "#" && (k === 0 || /\s/.test(line[k - 1]))) return line.slice(0, k).replace(/\s+$/, "");
  }
  return line.replace(/\s+$/, "");
}
export function parseDotEnv(text) {
  const out = {};
  for (const raw of String(text || "").split("\n")) {
    const m = raw.match(/^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*?)\s*$/);
    if (m) out[m[1]] = m[2].replace(/^["']|["']$/g, "");
  }
  return out;
}

function makeWhich(env) {
  return function whichSync(bin) {
    const exts = process.platform === "win32" ? [".cmd", ".exe", ".bat", ""] : [""];
    for (const dir of (env.PATH || "").split(path.delimiter)) {
      if (!dir) continue;
      for (const ext of exts) {
        const p = path.join(dir, bin + ext);
        try { fs.accessSync(p, fs.constants.X_OK); return p; } catch { /* keep looking */ }
      }
    }
    return null;
  };
}

/* ========================================================== CONTINUE
 * Continue (continue.dev) keeps its models in ~/.continue/config.yaml (or the
 * legacy config.json), with secrets in ~/.continue/.env. Mapping those onto
 * SWARM OS providers means a model you already set up there is one click away
 * here — and its key, like every other, stays inside this process.
 */
export const CONTINUE_PROVIDER_MAP = {
  openai: "openai", anthropic: "anthropic", gemini: "google", mistral: "mistral",
  deepseek: "deepseek", groq: "groq", xai: "xai", together: "together",
  cerebras: "cerebras", fireworks: "fireworks", openrouter: "openrouter",
  moonshot: "moonshot", zai: "zai",
  ollama: "ollama", lmstudio: "lmstudio", "llama.cpp": "llamacpp", llamacpp: "llamacpp",
  llamafile: "llamacpp", msty: "msty", lemonade: "lemonade", docker: "docker_models",
  "text-gen-webui": "textgenwebui", jan: "jan"
};
export function discoverContinue(home, env) {
  const dir = env.CONTINUE_GLOBAL_DIR || path.join(home, ".continue");
  const secrets = parseDotEnv(readText(path.join(dir, ".env")));
  const resolve = (v) => {
    if (typeof v !== "string") return v ?? null;
    const m = v.match(/^\$\{\{\s*secrets\.([A-Za-z0-9_]+)\s*\}\}$/);
    if (!m) return v.includes("${{") ? null : v;
    return secrets[m[1]] || env[m[1]] || null;
  };
  let cfg = null, file = null;
  for (const name of ["config.yaml", "config.yml", "config.json"]) {
    const f = path.join(dir, name);
    if (!exists(f)) continue;
    try { cfg = name.endsWith(".json") ? readJson(f) : tinyYaml(readText(f)); } catch { cfg = null; }
    file = f;
    if (cfg) break;
  }
  const models = [], hubRefs = [], keys = [];
  if (cfg && Array.isArray(cfg.models)) {
    for (const m of cfg.models) {
      if (!m || typeof m !== "object") continue;
      if (m.uses) { hubRefs.push(String(m.uses)); continue; }
      const cProvider = String(m.provider || "").toLowerCase();
      const swarm = CONTINUE_PROVIDER_MAP[cProvider] || null;
      const key = resolve(m.apiKey);
      const apiBase = resolve(m.apiBase);
      if (key && swarm && CREDENTIAL_HOSTS[swarm]) {
        // A custom apiBase means the key belongs to some other endpoint; only
        // adopt it for the provider when it points at that provider's own host.
        let ok = !apiBase;
        if (apiBase) { try { ok = CREDENTIAL_HOSTS[swarm].includes(new URL(apiBase).hostname); } catch { ok = false; } }
        if (ok) keys.push({ provider: swarm, key });
      }
      models.push({
        name: String(m.title || m.name || m.model || "model"),
        provider: cProvider, swarmProvider: swarm, model: String(m.model || ""),
        apiBase: apiBase || null, roles: Array.isArray(m.roles) ? m.roles : [], hasKey: !!key
      });
    }
  }
  const where = file ? (file.startsWith(home) ? "~" + file.slice(home.length) : file) : null;
  return { present: !!cfg, file: where, models, hubRefs, keys };
}

/* =================================================== CREDENTIAL DISCOVERY
 * Read-only. Values stay in this process; the browser only learns the names.
 */
export function discoverCredentials(home, env) {
  const found = {};
  const put = (provider, value, source) => {
    if (!value || found[provider]) return;
    found[provider] = { key: String(value).trim(), source };
  };
  const E = env;

  put("openrouter", E.OPENROUTER_API_KEY, "env OPENROUTER_API_KEY");
  put("openai", E.OPENAI_API_KEY, "env OPENAI_API_KEY");
  put("anthropic", E.ANTHROPIC_API_KEY, "env ANTHROPIC_API_KEY");
  put("google", E.GEMINI_API_KEY || E.GOOGLE_API_KEY, "env GEMINI_API_KEY");
  put("deepseek", E.DEEPSEEK_API_KEY, "env DEEPSEEK_API_KEY");
  put("groq", E.GROQ_API_KEY, "env GROQ_API_KEY");
  put("mistral", E.MISTRAL_API_KEY, "env MISTRAL_API_KEY");
  put("xai", E.XAI_API_KEY || E.GROK_API_KEY, "env XAI_API_KEY");
  put("together", E.TOGETHER_API_KEY, "env TOGETHER_API_KEY");
  put("cerebras", E.CEREBRAS_API_KEY, "env CEREBRAS_API_KEY");
  put("fireworks", E.FIREWORKS_API_KEY, "env FIREWORKS_API_KEY");
  put("zai", E.ZAI_API_KEY || E.ZHIPUAI_API_KEY || E.GLM_API_KEY || E.Z_AI_API_KEY, "env ZAI_API_KEY");
  put("moonshot", E.MOONSHOT_API_KEY || E.KIMI_API_KEY, "env MOONSHOT_API_KEY");
  put("jev", E.TYPESAFE_API_KEY || E.JEV_API_KEY, "env TYPESAFE_API_KEY");

  // Claude Code. It may be pointed at z.ai or Kimi via ANTHROPIC_BASE_URL, in
  // which case the token belongs to that plan, not to Anthropic.
  const anthBase = E.ANTHROPIC_BASE_URL || "";
  const anthTok = E.ANTHROPIC_AUTH_TOKEN || "";
  if (anthTok) {
    if (anthBase.includes("z.ai") || anthBase.includes("bigmodel")) put("zai", anthTok, "env ANTHROPIC_AUTH_TOKEN pointed at z.ai");
    else if (anthBase.includes("moonshot") || anthBase.includes("kimi")) put("moonshot", anthTok, "env ANTHROPIC_AUTH_TOKEN pointed at Kimi");
    else put("anthropic", anthTok, "env ANTHROPIC_AUTH_TOKEN");
  }
  for (const f of [path.join(home, ".claude", "settings.json"), path.join(home, ".claude.json"), path.join(home, ".config", "claude", "settings.json")]) {
    const j = readJson(f);
    if (!j) continue;
    const cenv = j.env || {};
    const base = cenv.ANTHROPIC_BASE_URL || "";
    const tok = cenv.ANTHROPIC_AUTH_TOKEN || cenv.ANTHROPIC_API_KEY || "";
    if (!tok) continue;
    const where = f.startsWith(home) ? "~" + f.slice(home.length) : f;
    if (base.includes("z.ai") || base.includes("bigmodel")) put("zai", tok, where);
    else if (base.includes("moonshot") || base.includes("kimi")) put("moonshot", tok, where);
    else put("anthropic", tok, where);
  }

  // Codex
  const codexAuth = readJson(path.join(home, ".codex", "auth.json"));
  if (codexAuth) put("openai", codexAuth.OPENAI_API_KEY || codexAuth.openai_api_key || codexAuth.api_key, "~/.codex/auth.json");
  const codexCfg = tinyToml(readText(path.join(home, ".codex", "config.toml")));
  Object.keys(codexCfg).forEach((k) => { if (/api_key$/i.test(k)) put("openai", codexCfg[k], "~/.codex/config.toml"); });

  // Kimi Code CLI
  const kimiCfg = tinyToml(readText(path.join(home, ".kimi", "config.toml")));
  Object.keys(kimiCfg).forEach((k) => { if (/api_key$/i.test(k)) put("moonshot", kimiCfg[k], "~/.kimi/config.toml"); });
  const kimiJson = readJson(path.join(home, ".kimi", "config.json"));
  if (kimiJson) put("moonshot", kimiJson.api_key || kimiJson.apiKey, "~/.kimi/config.json");

  // Gemini CLI
  const gem = readJson(path.join(home, ".gemini", "settings.json"));
  if (gem) put("google", gem.apiKey || (gem.security && gem.security.auth && gem.security.auth.apiKey), "~/.gemini/settings.json");

  // z.ai helpers
  const zai = readJson(path.join(home, ".z-ai", "config.json")) || readJson(path.join(home, ".zai", "config.json"));
  if (zai) put("zai", zai.api_key || zai.apiKey || zai.token, "~/.z-ai/config.json");

  // Continue — last, so a dedicated CLI's own credential wins a tie.
  const cont = discoverContinue(home, env);
  for (const k of cont.keys) put(k.provider, k.key, cont.file || "~/.continue");

  // Search providers
  const search = {};
  const puts = (n, v, s) => { if (v && !search[n]) search[n] = { key: String(v).trim(), source: s }; };
  puts("tavily", E.TAVILY_API_KEY, "env TAVILY_API_KEY");
  puts("exa", E.EXA_API_KEY, "env EXA_API_KEY");
  puts("firecrawl", E.FIRECRAWL_API_KEY, "env FIRECRAWL_API_KEY");
  puts("serper", E.SERPER_API_KEY, "env SERPER_API_KEY");
  puts("brave", E.BRAVE_API_KEY || E.BRAVE_SEARCH_API_KEY, "env BRAVE_API_KEY");

  return { found, search, continue: cont };
}

/* ========================================================== LOCAL SERVERS
 * Every local runtime Continue ships a provider for, at its default port.
 * Detected only — nothing is ever started for you. Local inference has no
 * per-token price and no quota: this is the genuinely unlimited free route.
 * Every probe must answer with a model list, so an unrelated dev server on a
 * generic port (5000, 8000, 8080) is not mistaken for one.
 */
export const LOCAL_SERVERS = [
  { provider: "ollama", name: "Ollama", base: "http://127.0.0.1:11434/v1", probe: "http://127.0.0.1:11434/api/tags" },
  { provider: "lmstudio", name: "LM Studio", base: "http://127.0.0.1:1234/v1", probe: "http://127.0.0.1:1234/v1/models" },
  { provider: "llamacpp", name: "llama.cpp / Llamafile", base: "http://127.0.0.1:8080/v1", probe: "http://127.0.0.1:8080/v1/models" },
  { provider: "jan", name: "Jan", base: "http://127.0.0.1:1337/v1", probe: "http://127.0.0.1:1337/v1/models" },
  { provider: "msty", name: "Msty", base: "http://127.0.0.1:10000/v1", probe: "http://127.0.0.1:10000/v1/models" },
  { provider: "lemonade", name: "Lemonade", base: "http://127.0.0.1:8000/api/v1", probe: "http://127.0.0.1:8000/api/v1/models" },
  { provider: "docker_models", name: "Docker Model Runner", base: "http://127.0.0.1:12434/engines/v1", probe: "http://127.0.0.1:12434/engines/v1/models" },
  { provider: "textgenwebui", name: "text-generation-webui", base: "http://127.0.0.1:5000/v1", probe: "http://127.0.0.1:5000/v1/models" }
];
export async function detectLocalServers(servers = LOCAL_SERVERS, timeoutMs = 700) {
  const found = await Promise.all(servers.map(async (s) => {
    try {
      const r = await fetch(s.probe, { signal: AbortSignal.timeout(timeoutMs) });
      if (!r.ok) return null;
      const j = await r.json().catch(() => null);
      const list = j && (Array.isArray(j.data) ? j.data : Array.isArray(j.models) ? j.models : null);
      if (!list) return null;
      const models = list.map((m) => (m && (m.id || m.name || m.model)) || null).filter(Boolean).slice(0, 200);
      return { provider: s.provider, name: s.name, url: s.base, models };
    } catch { return null; }
  }));
  return found.filter(Boolean);
}

    ${sw.toolLog.map((t, i) => `<tr><td>${i + 1}</td><td class="mono">${esc(t.name)}</td><td>${t.ok ? "" : "<span class='pill bad'>failed</span> "}${esc(t.summary || "")}</td><td>${fmtMs(t.ms)}</td></tr>`).join("")}
    </tbody></table></details>`;
}

/* -------------------------------------------------------------- swarm view */
function renderSwarmView() {
  const sw = currentSwarm();
  if (!sw) return `<div class="grid">${hero("Swarm map", "Nothing has been dispatched yet. Ask the orchestrator for something that needs more than one head.", `<button class="btn primary" data-nav="orchestrator">Back to the chat</button>`)}<div class="empty">No swarm yet.</div></div>`;
  const byRole = {};
  sw.agents.forEach(a => (byRole[a.role] ||= []).push(a));
  const done = sw.agents.filter(a => a.status === "done").length;
  return `<div class="grid">
    ${hero("Swarm map", esc(sw.objective.slice(0, 190)),
      `<button class="btn" data-nav="orchestrator">Back to chat</button>
       <button class="btn" data-action="export-run">Export run as Markdown</button>
       <button class="btn" data-action="export-run-json">Export JSON</button>
       ${RUN.active ? `<button class="btn danger" data-action="stop">Stop</button>` : ""}`)}

    <div class="metrics">
      <div class="metric"><b>${sw.agents.length}</b><span>Agents</span></div>
      <div class="metric"><b>${done}</b><span>Returned</span></div>
      <div class="metric"><b>${sw.agents.filter(a => a.status === "failed").length}</b><span>Failed</span></div>
      <div class="metric"><b>${sw.toolLog.length}</b><span>Tool calls</span></div>
      <div class="metric"><b>${sw.hops}</b><span>Hops</span></div>
      <div class="metric"><b>${fmtNum(RUN.metrics.tokens)}</b><span>Tokens</span></div>
      <div class="metric"><b>${fmtMoney(RUN.metrics.cost)}</b><span>Cost</span></div>
    </div>

    <div class="cols2">
      <div class="panel">
        <div class="panel-title"><div><h3>Topology</h3><p>Orchestrator at the centre, one ring per role.</p></div></div>
        <canvas class="viz" id="swarmChart"></canvas>
      </div>
      <div class="panel">
        <div class="panel-title"><div><h3>Cost by model</h3><p>What each model actually charged this run.</p></div></div>
        ${Object.keys(RUN.metrics.byModel).length ? `<table class="data"><thead><tr><th>Model</th><th>Calls</th><th>Tokens</th><th>Time</th><th>Cost</th></tr></thead><tbody>
          ${Object.entries(RUN.metrics.byModel).sort((a, b) => b[1].cost - a[1].cost).map(([m, v]) => `<tr><td class="mono">${esc(m)}</td><td>${v.calls}</td><td>${fmtNum(v.tokens)}</td><td>${fmtMs(v.ms)}</td><td>${fmtMoney(v.cost)}</td></tr>`).join("")}
        </tbody></table>` : `<div class="empty">No calls billed yet.</div>`}
      </div>
    </div>

    ${sw.dod ? `<div class="panel">${renderDoD(sw.dod, sw.dodReport, true)}</div>` : ""}
    ${renderEvidenceLedger(sw)}

    <div class="panel">
      <div class="panel-title"><div><h3>Agents</h3><p>Every model the orchestrator woke up, with its full brief and full output. Click one to expand.</p></div>
        <div class="row"><button class="btn small" data-action="expand-all-agents">Expand all</button><button class="btn small" data-action="collapse-all-agents">Collapse</button></div></div>
      ${sw.agents.length ? Object.entries(byRole).map(([role, list]) => `
        <div class="lane" style="margin-bottom:14px">
          <div class="lane-head"><span>${ROLES[role]?.icon || "◆"} ${esc(ROLES[role]?.label || role)}</span><span>${list.length}</span></div>
          ${list.map(renderAgentCard).join("")}
        </div>`).join("") : `<div class="empty">No agents in this run.</div>`}
    </div>

    <div class="panel">
      <div class="panel-title"><div><h3>Orchestration trace</h3><p>Every tool call in order, with what it returned.</p></div></div>
      ${sw.toolLog.length ? `<table class="data"><thead><tr><th>#</th><th>Tool</th><th>Arguments</th><th>Result</th><th>Time</th></tr></thead><tbody>
        ${sw.toolLog.map((t, i) => `<tr><td>${i + 1}</td><td class="mono">${esc(t.name)}</td><td class="mono" style="max-width:280px;font-size:11px;color:var(--muted)">${esc(JSON.stringify(t.args).slice(0, 180))}</td><td>${t.ok ? "" : "<span class='pill bad'>failed</span> "}${esc(t.summary || "")}</td><td>${fmtMs(t.ms)}</td></tr>`).join("")}
      </tbody></table>` : `<div class="empty">No tool calls yet.</div>`}
    </div>
  </div>`;
}

function renderAgentCard(a) {
  const v = a.verdict;
  return `<div class="agent-card ${a.status}" data-agent="${a.id}">
    <header data-toggle-agent="${a.id}">
      <span class="ico" style="width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--panel3);border:1px solid var(--line)">${ROLES[a.role]?.icon || "◆"}</span>
      <div style="flex:1;min-width:0">
        <h4 class="nowrap">${esc(ROLES[a.role]?.label || a.role)} · <span class="mono" style="font-weight:400;color:var(--muted)">${esc(a.model)}</span></h4>
        <p class="nowrap">${esc((a.task || "").slice(0, 120))}</p>
      </div>
      <div class="row" style="flex:0 0 auto;gap:5px">
        ${a.duplicateOf ? `<span class="pill warn" title="Near-identical to another agent's output">echo</span>` : ""}
        ${v ? `<span class="pill ${v.accepted ? "ok" : "bad"}" title="${esc(v.reason || "")}">judge ${v.score}</span>` : ""}
        <span class="pill">${fmtMs(a.ms)}</span>
        <span class="pill">${fmtMoney(a.cost)}</span>
        <span class="pill ${a.status === "done" ? "ok" : a.status === "failed" ? "bad" : "info"}">${a.status === "running" ? "working" : a.status}</span>
      </div>
    </header>
    <div class="body">
      <p class="subtle" style="margin-bottom:6px"><b>Brief</b></p>
      <pre style="color:var(--muted);margin-bottom:12px">${esc(a.task)}</pre>
      ${a.doneCriteria?.length ? `<p class="subtle" style="margin-bottom:6px"><b>Accountable for:</b> ${esc(a.doneCriteria.join(" · "))}</p>` : ""}
      <hr class="hr">
      ${a.status === "failed"
        ? `<div class="banner bad"><span>✗</span><div>${esc(a.error || "No output.")}</div></div>`
        : `<pre>${esc(a.output || "…")}</pre>`}
      ${v ? `<hr class="hr"><p class="subtle"><b>Judge (${v.accepted ? "admitted" : "rejected"}, ${v.score}/100):</b> ${esc(v.reason || "")}${v.defects?.length ? " — defects: " + esc(v.defects.join(", ")) : ""}</p>` : ""}
      <div class="row" style="margin-top:11px">
        <button class="btn tiny" data-copy-agent="${a.id}">Copy output</button>
        <button class="btn tiny" data-artifact-agent="${a.id}">Save as artifact</button>
        <button class="btn tiny" data-rerun-agent="${a.id}">Re-run this agent</button>
      </div>
    </div>
  </div>`;
}

/* ---------------------------------------------------------------- DoD view */
function renderDoDView() {
  const sw = currentSwarm();
  return `<div class="grid">
    ${hero("Definition of Done",
      "Every run in this app carries one. The orchestrator is required to declare it before it starts working — and if it does not, the harness writes one from your request and verifies against that instead. Either way you get this page.",
      `<button class="btn" data-nav="orchestrator">Back to chat</button>
       ${sw?.dod ? `<button class="btn" data-action="reverify-dod">Re-verify now</button><button class="btn" data-action="copy-dod-md">Copy as Markdown</button>` : ""}`)}

    ${sw?.dod ? `<div class="panel">${renderDoD(sw.dod, sw.dodReport)}</div>` : `<div class="empty">No run yet. Ask the orchestrator for something and this fills in.</div>`}

    <div class="panel">
      <div class="panel-title"><div><h3>How this is enforced</h3><p>Not a prompt suggestion — four mechanisms, in order.</p></div></div>
      <table class="data">
        <thead><tr><th>Stage</th><th>What happens</th><th>If it is skipped</th></tr></thead>
        <tbody>
          <tr><td><b>1 · Declare</b></td><td><span class="mono">define_done</span> is the first tool in the orchestrator's schema and its description says it is required before any work.</td><td>The run continues, but stage 3 catches it.</td></tr>
          <tr><td><b>2 · Distribute</b></td><td>Every spawned agent receives the run's criteria, plus whichever ones it is personally accountable for, inside its own system prompt.</td><td>Agents work without a target and the judge scores them lower.</td></tr>
          <tr><td><b>3 · Backfill</b></td><td>When the orchestrator finishes without a declared DoD, the harness derives one from your original request and the produced work.</td><td>Cannot be skipped — it runs on the completion path.</td></tr>
          <tr><td><b>4 · Verify</b></td><td>An independent verifier model marks each criterion <span class="pill ok">met</span> <span class="pill warn">partial</span> <span class="pill bad">unmet</span> and quotes the evidence.</td><td>With no API key, criteria stay <span class="pill">unchecked</span> and say so rather than claiming a pass.</td></tr>
        </tbody>
      </table>
      <div class="cols3" style="margin-top:16px">
        <label class="check"><input type="checkbox" data-set="requireDoD" ${state.settings.requireDoD ? "checked" : ""}>Require a Definition of Done</label>
        <label class="check"><input type="checkbox" data-set="autoVerifyDoD" ${state.settings.autoVerifyDoD ? "checked" : ""}>Auto-verify at the end</label>
        <label class="check"><input type="checkbox" data-set="dodStrict" ${state.settings.dodStrict ? "checked" : ""}>Strict: warn loudly on unmet</label>
      </div>
    </div>

    ${state.swarms.filter(x => x.dod).length > 1 ? `<div class="panel">
      <div class="panel-title"><div><h3>Past runs</h3><p>Every completed run keeps its report.</p></div></div>
      <table class="data"><thead><tr><th>When</th><th>Objective</th><th>Met</th><th>Unmet</th><th>Source</th><th></th></tr></thead><tbody>
      ${state.swarms.filter(x => x.dod).slice(0, 25).map(x => {
        const met = x.dod.criteria.filter(c => c.status === "met").length;
        const unmet = x.dod.criteria.filter(c => c.status === "unmet").length;
        return `<tr><td>${fmtTime(x.created)}</td><td style="max-width:360px">${esc(x.objective.slice(0, 120))}</td><td><span class="pill ok">${met}</span></td><td>${unmet ? `<span class="pill bad">${unmet}</span>` : "—"}</td><td class="subtle">${esc(x.dod.declaredBy)}</td><td><button class="btn tiny" data-open-swarm="${x.id}">open</button></td></tr>`;
      }).join("")}
      </tbody></table></div>` : ""}
  </div>`;
}

/* -------------------------------------------------------------- arena view */
function renderArena() {
  const a = state.arena;
  const chosen = state.arenaPick || [state.settings.orchestratorModel, state.settings.defaultAgentModel].filter(Boolean);
  return `<div class="grid">
    ${hero("Model Arena", "Same prompt, several models, side by side, scored by an independent judge. Use it to decide which model to put in your swarm rather than guessing from a leaderboard.")}
    <div class="panel">
      <div class="panel-title"><div><h3>Set up a match</h3><p>Pick two or more models. They all run in parallel.</p></div></div>
      <label for="arenaPrompt">Prompt</label>
      <textarea id="arenaPrompt" rows="4" placeholder="Write the prompt every model will receive.">${esc(state.arenaDraft ?? a?.prompt ?? "")}</textarea>
      <label style="margin-top:12px">Contestants</label>
      <div class="chips">
        ${/* Chosen models come first, so a model added by hand always gets a chip
             that can deselect it again. Without this the counter says 3 while
             only one chip looks selected, and the other two cannot be removed. */
          [...chosen, ...CURATED_MODELS.slice(0, 16).map(m => m.id), ...state.models.slice(0, 8).map(m => m.id)]
          .filter((v, i, arr) => v && arr.indexOf(v) === i).slice(0, 26)
          .map(id => `<button class="chip ${chosen.includes(id) ? "active" : ""}" data-arena-pick="${esc(id)}">${esc(modelLabel(id))}</button>`).join("")}
      </div>
      <div class="row" style="margin-top:12px">
        <input id="arenaCustom" placeholder="…or type any OpenRouter model id and press Add" style="flex:2;min-width:240px">
        <button class="btn small" data-action="arena-add-custom">Add</button>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn primary" data-action="run-arena" ${RUN.active ? "disabled" : ""}>Run the arena (${chosen.length})</button>
        ${RUN.active ? `<button class="btn danger" data-action="stop">Stop</button>` : ""}
        <span class="subtle">${chosen.length} selected · judged by ${esc(state.settings.judgeModel)}</span>
      </div>
    </div>

    ${a ? `<div class="panel">
      <div class="panel-title"><div><h3>Results</h3><p>${a.status === "running" ? "Running…" : "Complete"}${a.winner ? ` · highest score: <b>${esc(modelLabel(a.winner))}</b>` : ""}</p></div>
        <button class="btn small" data-action="export-arena">Export</button></div>
      <div class="cols2">
        ${a.entries.map(e => `<div class="agent-card ${e.status} open">
          <header>
            <div style="flex:1;min-width:0"><h4 class="nowrap">${esc(modelLabel(e.model))}</h4><p class="mono nowrap">${esc(e.model)}</p></div>
            <div class="row" style="gap:5px;flex:0 0 auto">
              ${e.score != null ? `<span class="pill ${e.score >= 75 ? "ok" : e.score >= 50 ? "warn" : "bad"}">${e.score}</span>` : ""}
              <span class="pill">${fmtMs(e.ms)}</span><span class="pill">${fmtMoney(e.cost)}</span>
              <span class="pill ${e.status === "done" ? "ok" : e.status === "failed" ? "bad" : "info"}">${e.status}</span>
            </div>
          </header>
          <div class="body"><pre>${esc(e.output || "…")}</pre>
          ${e.verdict ? `<hr class="hr"><p class="subtle">${esc(e.verdict.reason || "")}</p>` : ""}</div>
        </div>`).join("")}
      </div>
    </div>` : ""}
  </div>`;
}

/* ----------------------------------------------------------------- ops deck */
function renderOps() {
  const modes = ["all", ...Array.from(new Set(OPS.map(o => o.mode))).sort()];
  const list = OPS.filter(o =>
    (state.opsFilter === "all" || o.mode === state.opsFilter) &&
    (!state.opsQuery || `${o.title} ${o.desc} ${o.mode} ${o.key}`.toLowerCase().includes(state.opsQuery.toLowerCase())));
  return `<div class="grid">
    ${hero("Ops Deck", `${OPS.length} built-in operations lanes carried over from the RTBT harness — security review, supply chain, threat modelling, incident response, repo health, and more. Run one directly, or hand it to the swarm and let the orchestrator route it.`,
      `<button class="btn primary" data-action="import-files-click">Import files</button>
       <button class="btn" data-action="import-folder-click">Import folder</button>
       <button class="btn" data-nav="orchestrator">Ask the orchestrator instead</button>`)}
    <input id="hiddenFiles" type="file" multiple class="hide"><input id="hiddenFolder" type="file" multiple webkitdirectory directory class="hide">
    <div class="panel">
      <div class="row">
        <input id="opsSearch" placeholder="Search ${OPS.length} lanes…" value="${esc(state.opsQuery)}" style="flex:2;min-width:220px">
        <select id="opsMode" style="flex:1;min-width:160px">${modes.map(m => `<option value="${m}" ${state.opsFilter === m ? "selected" : ""}>${m === "all" ? "All modes" : m}</option>`).join("")}</select>
        <label class="check" style="width:auto"><input type="checkbox" data-set="includeWorkspace" ${state.settings.includeWorkspace ? "checked" : ""}>Include workspace</label>
        <span class="subtle">${list.length} shown</span>
      </div>
    </div>
    <div class="card-grid">
      ${list.map(o => {
        const run = state.runs.find(r => r.laneKey === o.key);
        return `<div class="fcard">
          <div class="top"><div class="ficon">${o.icon}</div><div style="min-width:0"><h4>${esc(o.title)}</h4><p class="fdesc">${esc(o.desc)}</p></div></div>
          <textarea id="ops-${safeCss(o.key)}" placeholder="${esc(o.placeholder || "")}" rows="3">${esc(run?.input || "")}</textarea>
          <div class="row">
            <button class="btn small primary" data-ops-run="${o.key}">${esc(o.action || "Run")}</button>
            <button class="btn small" data-ops-swarm="${o.key}">Hand to swarm</button>
            <span class="pill">${esc(o.mode)}</span>
          </div>
          <div class="out ${run?.output ? "show" : ""}" id="opsout-${safeCss(o.key)}">${run?.output ? md(run.output) : ""}</div>
        </div>`;
      }).join("") || `<div class="empty">No lane matches that search.</div>`}
    </div>
  </div>`;
}

/* ---------------------------------------------------------------- workspace */
function renderWorkspace() {
  const files = state.files.filter(f => !state.fileFilter || `${f.name} ${f.path} ${f.language}`.toLowerCase().includes(state.fileFilter.toLowerCase()));
  const totalBytes = state.files.reduce((n, f) => n + (f.size || 0), 0);
  const sel = state.files.filter(f => f.selected).length;
  return `<div class="grid">
    ${hero("Workspace", "Files you import stay in this browser. Agents read them through <span class='mono'>search_workspace</span> and <span class='mono'>read_workspace_file</span> — nothing is uploaded except what actually gets quoted into a prompt.",
      `<button class="btn primary" data-action="import-files-click">Import files</button>
       <button class="btn" data-action="import-folder-click">Import folder</button>
       <button class="btn" data-action="export-workspace">Export everything</button>
       <button class="btn" data-action="import-workspace-click">Import a bundle</button>
       <button class="btn danger" data-action="clear-files">Clear files</button>`)}
    <input id="hiddenFiles" type="file" multiple class="hide"><input id="hiddenFolder" type="file" multiple webkitdirectory directory class="hide"><input id="hiddenBundle" type="file" accept=".json" class="hide">
    <div class="metrics">
      <div class="metric"><b>${state.files.length}</b><span>Files</span></div>
      <div class="metric"><b>${bytes(totalBytes)}</b><span>Total size</span></div>
      <div class="metric"><b>${sel}</b><span>Pinned for context</span></div>
      <div class="metric"><b>${new Set(state.files.map(f => f.language)).size}</b><span>Languages</span></div>
      <div class="metric"><b>${state.memories.length}</b><span>Memories</span></div>
    </div>
    <div class="cols2">
      <div class="panel">
        <div class="panel-title"><div><h3>Files</h3><p>Pin a file to force it into every agent's context.</p></div></div>
        <input id="fileSearch" placeholder="Filter…" value="${esc(state.fileFilter)}" style="margin-bottom:11px">
        <div class="scroll" style="max-height:460px">
          ${files.map(f => `<div class="rowitem">
            <span class="ico">${f.type.startsWith("image") ? "🖼" : "📄"}</span>
            <div class="info"><b class="nowrap">${esc(f.path || f.name)}</b><p>${esc(f.language)} · ${bytes(f.size)} · ${esc((f.hash || "").slice(0, 10))}</p></div>
            <button class="btn tiny ${f.selected ? "primary" : ""}" data-pin-file="${f.id}">${f.selected ? "pinned" : "pin"}</button>
            <button class="btn tiny" data-view-file="${f.id}">view</button>
            <button class="btn tiny danger" data-del-file="${f.id}">×</button>
          </div>`).join("") || `<div class="empty">Nothing imported yet.</div>`}
        </div>
      </div>
      <div class="grid">
        <div class="panel">
          <div class="panel-title"><div><h3>Language mix</h3><p>What is actually in here.</p></div></div>
          <canvas class="spark" id="langChart"></canvas>
        </div>
        <div class="panel">
          <div class="panel-title"><div><h3>Durable memory</h3><p>Constraints that survive into every future session. The orchestrator writes these itself with <span class="mono">remember</span>.</p></div></div>
          <textarea id="memoryInput" rows="2" placeholder="e.g. Never put provider keys in shared client code."></textarea>
          <div class="row" style="margin-top:9px"><button class="btn small" data-action="add-memory">Remember this</button><button class="btn small danger" data-action="clear-memories">Forget all</button></div>
          <div class="scroll" style="margin-top:11px;max-height:220px">
            ${state.memories.map(m => `<div class="rowitem"><span class="ico">✦</span><div class="info"><b style="font-weight:500;white-space:normal">${esc(m.text)}</b><p>${esc(m.tag || "general")} · ${fmtTime(m.created)}</p></div><button class="btn tiny danger" data-del-memory="${m.id}">×</button></div>`).join("") || `<div class="empty">No memories yet.</div>`}
          </div>
        </div>
      </div>
    </div>
    ${state.viewFile ? `<div class="panel"><div class="panel-title"><div><h3>${esc(state.viewFile.path || state.viewFile.name)}</h3><p>${esc(state.viewFile.language)} · ${bytes(state.viewFile.size)}</p></div><button class="btn small" data-action="close-file">Close</button></div>
      ${state.viewFile.dataUrl ? `<img src="${esc(state.viewFile.dataUrl)}" style="max-width:100%;border-radius:var(--r2);border:1px solid var(--line)">` : `<pre class="mono" style="max-height:520px;overflow:auto;background:var(--panel2);padding:13px;border-radius:var(--r2);border:1px solid var(--line);white-space:pre-wrap">${esc((state.viewFile.text || state.viewFile.summary || "").slice(0, 120000))}</pre>`}</div>` : ""}
  </div>`;
}

/* ---------------------------------------------------------------- artifacts */
function renderArtifacts() {
  const sel = state.artifacts.find(a => a.id === state.selectedArtifact) || state.artifacts[0] || null;
  return `<div class="grid">
    ${hero("Artifacts", "Anything a model writes as code becomes a real file here — versioned, downloadable, and for HTML, rendered live in a sandboxed frame.",
      `<button class="btn primary" data-action="new-artifact">Blank artifact</button>
       ${sel ? `<button class="btn" data-action="download-artifact">Download</button><button class="btn" data-action="copy-artifact">Copy</button><button class="btn danger" data-action="delete-artifact">Delete</button>` : ""}`)}
    <div class="chat-layout">
      <div class="panel">
        ${sel ? `
          <div class="panel-title"><div><h3>${esc(sel.name)}</h3><p>${esc(sel.language)} · v${sel.version} · ${bytes(sel.content.length)} · ${fmtTime(sel.created)}${sel.source ? " · from " + esc(sel.source) : ""}</p></div>
            <div class="row">${isHtmlArtifact(sel) ? `<button class="btn small" data-action="toggle-artifact-preview">${state.artifactPreview ? "Show source" : "Render it"}</button>` : ""}<button class="btn small" data-action="save-artifact-edit">Save edit</button></div></div>
          ${sel.description ? `<p class="subtle" style="margin-bottom:10px">${esc(sel.description)}</p>` : ""}
          ${state.artifactPreview && isHtmlArtifact(sel)
            ? `<iframe class="preview-frame" style="height:64dvh" sandbox="allow-scripts allow-forms allow-modals" srcdoc="${esc(sel.content)}"></iframe>`
            : `<textarea id="artifactEditor" class="mono" style="min-height:60dvh;line-height:1.55">${esc(sel.content)}</textarea>`}

/* ------------------------------------------------------------ skin engine */
function hexToRgb(h) { h = String(h || "#000000").trim(); if (/^#[0-9a-f]{3}$/i.test(h)) h = "#" + h.slice(1).split("").map(c => c + c).join(""); const n = parseInt(h.slice(1), 16) || 0; return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 } }
function rgba(h, a) { const c = hexToRgb(h); return `rgba(${c.r},${c.g},${c.b},${a})` }
function luma(h) { const c = hexToRgb(h); return (.299 * c.r + .587 * c.g + .114 * c.b) / 255 }
function hsl(h, s, l) { s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l), f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1))); return "#" + [f(0), f(8), f(4)].map(x => Math.round(255 * x).toString(16).padStart(2, "0")).join("") }
function normHex(v, fb) { v = String(v || "").trim(); if (/^#[0-9a-f]{3}$/i.test(v)) return "#" + v.slice(1).split("").map(c => c + c).join("").toLowerCase(); if (/^#[0-9a-f]{6}$/i.test(v)) return v.toLowerCase(); return fb }

function applySkin(k, save = true) {
  state.skin = { ...defaultSkin(), ...k };
  const s = state.skin, d = document.documentElement, st = d.style;
  d.dataset.theme = s.base; d.dataset.density = s.density; d.dataset.motion = s.motion;
  d.dataset.buttons = s.buttonStyle || "glass"; d.dataset.shape = s.buttonShape || "soft";
  d.dataset.wallpaper = s.wallpaper || "none"; d.dataset.texture = s.texture || "none";
  d.dataset.mobilenav = s.mobileNav || "bar"; d.dataset.taps = s.largeTaps === false ? "normal" : "large";
  st.setProperty("--texture-op", String((Number(s.textureOpacity) || 0) / 100));
  const dark = luma(s.bg) < .5;
  const set = (key, val) => st.setProperty(key, val);
  set("--bg", s.bg); set("--bg2", s.bg2);
  set("--panel", rgba(s.panel, dark ? .86 : .9));
  set("--panel2", rgba(s.panel, dark ? .95 : .99));
  set("--panel3", rgba(s.text, dark ? .05 : .045));
  set("--line", rgba(s.text, s.lineStrength / 100));
  set("--line2", rgba(s.text, Math.min(.6, (s.lineStrength + 13) / 100)));
  set("--text", s.text); set("--muted", s.muted); set("--soft", rgba(s.text, .8));
  set("--accent", s.accent); set("--accent2", s.accent2);
  set("--blue", s.blue); set("--violet", s.violet); set("--green", s.green);
  set("--r", s.radius + "px"); set("--r2", Math.max(6, Math.round(s.radius * .7)) + "px");
  set("--r3", Math.max(4, Math.round(s.radius * .48)) + "px");
  set("--blur", s.blur + "px"); set("--maxw", s.maxw + "px");
  set("--fs", (14 * s.fontScale / 100).toFixed(2) + "px");
  set("--font", FONT_STACKS[s.font] || FONT_STACKS.system);
  set("--shadow", dark ? "0 24px 80px rgba(0,0,0,.46)" : "0 22px 70px rgba(15,23,42,.14)");
  set("--glow", `0 0 30px ${rgba(s.accent, .18)}`);
  if (save && s.autosave !== false) saveSkin();
}

function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || "#888" }
function fitCanvas(c) {
  const dpr = devicePixelRatio || 1, r = c.getBoundingClientRect();
  c.width = Math.max(1, r.width * dpr); c.height = Math.max(1, r.height * dpr);
  const ctx = c.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, r.width, r.height);
  return { ctx, w: r.width, h: r.height };
}
function nodeColor(t) {

    model: cssVar("--red") || cssVar("--accent2"), file: cssVar("--amber"), artifact: cssVar("--green"),
    event: cssVar("--muted"), run: cssVar("--blue") }[t] || cssVar("--text");
}
function buildGraphData() {
  const nodes = [], edges = [];
  const add = (type, id, label, detail, provenance) => { if (!id || nodes.some(n => n.id === id)) return; nodes.push({ type, id, label: String(label || id).slice(0, 40), detail, provenance }) };
  const src = state.monitorSource;
  if (src.sessions) state.sessions.slice(0, 20).forEach(s => add("session", s.id, s.title, `${s.messages.length} messages`, "sessions store"));
  if (src.swarms) state.swarms.slice(0, 20).forEach(sw => {
    add("swarm", sw.id, sw.objective.slice(0, 34), `${sw.agents.length} agents · ${sw.status}`, "swarms store");
    if (sw.sessionId) edges.push({ from: sw.sessionId, to: sw.id });
    sw.agents.slice(0, 40).forEach(a => {
      add("agent", a.id, (ROLES[a.role]?.label || a.role), `${a.model} · ${a.status}`, "agent dispatch");
      edges.push({ from: sw.id, to: a.id });
      add("model", "m:" + a.model, a.model, "Called by an agent", "OpenRouter");
      edges.push({ from: a.id, to: "m:" + a.model });
    });
  });
  if (src.runs) state.runs.slice(0, 30).forEach(r => { add("run", r.id, r.title, `${r.status} · ${r.model}`, "runs store"); add("model", "m:" + r.model, r.model, "Used by a lane run", "OpenRouter"); edges.push({ from: r.id, to: "m:" + r.model }) });
  if (src.files) state.files.slice(0, 60).forEach(f => add("file", f.id, f.name, `${f.language} · ${bytes(f.size)}`, "files store"));
  if (src.artifacts) state.artifacts.slice(0, 40).forEach(a => { add("artifact", a.id, a.name, `${a.language} · v${a.version}`, "artifacts store"); if (a.swarmId) edges.push({ from: a.swarmId, to: a.id }); if (a.sessionId) edges.push({ from: a.sessionId, to: a.id }) });
  if (src.events) state.events.slice(0, 40).forEach(e => add("event", e.id, e.label, `${e.type} · ${fmtTime(e.created)}`, "events store"));

}

function drawThree(data, canvas) {

  });

    const p = pos[n.id]; if (!p) return;

    mesh.position.set(p.x, p.y, p.z); mesh.userData = n; scene.add(mesh); threeCtx.objects.push(mesh);
  });

  renderer.render(scene, camera);

    const r = canvas.getBoundingClientRect();
    const mouse = new THREE.Vector2(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
    const ray = new THREE.Raycaster(); ray.setFromCamera(mouse, camera);

  };
}
function drawGraph2D(data, canvas) {
  const { ctx, w, h } = fitCanvas(canvas);
  const cx = w / 2, cy = h / 2, types = Array.from(new Set(data.nodes.map(n => n.type))), pos = {};
  types.forEach((t, ti) => {
    const grp = data.nodes.filter(n => n.type === t);
    grp.forEach((n, i) => {
      const a = (i / Math.max(1, grp.length)) * Math.PI * 2 + ti * .45, r = Math.min(w, h) * .06 + ti * (Math.min(w, h) * .055);
      pos[n.id] = { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, n };
    });
  });

  data.edges.forEach(e => { const a = pos[e.from], b = pos[e.to]; if (!a || !b) return; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke() });
  ctx.globalAlpha = 1; ctx.font = "11px " + (cssVar("--font") || "system-ui");

    ctx.fillStyle = nodeColor(p.n.type);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.n.type === "swarm" ? 8 : 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = cssVar("--muted"); ctx.fillText(p.n.label.slice(0, 16), p.x + 9, p.y + 4);

    const r = canvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;

    if (best && dist < 24) { state.selectedNode = best; const el = $("#nodeInspector"); if (el) el.innerHTML = renderNodeInspector() }
  };
}
function drawEventChart() {
  const c = $("#eventChart"); if (!c) return;

}
function drawLangChart() {

function drawSwarmChart() {
  const c = $("#swarmChart"); if (!c) return;
  const sw = currentSwarm(); const { ctx, w, h } = fitCanvas(c);
  if (!sw || !sw.agents.length) { ctx.fillStyle = cssVar("--muted"); ctx.font = "12px system-ui"; ctx.fillText("No agents dispatched.", 14, h / 2); return }
  const cx = w / 2, cy = h / 2;

  const pts = [];
  roles.forEach((role, ri) => {
    const grp = sw.agents.filter(a => a.role === role);
    grp.forEach((a, i) => {
      const ang = (ri / roles.length) * Math.PI * 2 + (i - (grp.length - 1) / 2) * .22;
      const r = Math.min(w, h) * .2 + (i % 2) * 26;

  });
}

/* --------------------------------------------------------- command palette */
function cmdkCommands() {
  const c = [];
  VIEWS.forEach(v => c.push({ label: "Go to " + v.label, key: "view", run: () => go(v.id) }));
  c.push({ label: "Send the current draft to the orchestrator", key: "run", run: () => send() });
  c.push({ label: "Stop the running swarm", key: "run", run: stopRun });
  c.push({ label: "New session", key: "session", run: newSession });
  c.push({ label: "Refresh the OpenRouter catalogue", key: "models", run: () => loadModels() });
  c.push({ label: "Test the API key", key: "models", run: testKey });
  c.push({ label: "Run the self-test", key: "debug", run: selfTest });
  c.push({ label: "Export this run as Markdown", key: "export", run: exportRunMd });
  c.push({ label: "Export the whole workspace", key: "export", run: () => download("swarm-os-workspace.json", exportWorkspace(false)) });
  c.push({ label: "Generate a random palette", key: "theme", run: randomSkin });
  Object.entries(BLUEPRINTS).forEach(([k, b]) => c.push({ label: "Blueprint: " + b.label, key: "blueprint", run: () => { state.settings.blueprint = k; saveSettings(); toast("Blueprint: " + b.label); render() } }));
  THEMES.forEach(t => c.push({ label: "Theme: " + t, key: "theme", run: () => { applySkin({ ...state.skin, base: t }); render() } }));
  OPS.slice(0, 59).forEach(o => c.push({ label: "Ops lane: " + o.title, key: "ops", run: () => { state.view = "ops"; state.opsQuery = o.title; render() } }));
  return c;
}
function openCmdk() {
  state.cmdkOpen = true; state.cmdkSel = 0;
  $("#cmdk").classList.add("show");
  const i = $("#cmdkInput"); i.value = ""; i.focus();
  renderCmdk("");
}
function closeCmdk() { state.cmdkOpen = false; $("#cmdk").classList.remove("show") }
function cmdkMatches(q) {
  const all = cmdkCommands();
  if (!q) return all.slice(0, 12);
  const l = q.toLowerCase();
  return all.filter(c => c.label.toLowerCase().includes(l) || c.key.includes(l)).slice(0, 14);
}
function renderCmdk(q) {
  const m = cmdkMatches(q);
  state._cmdkMatches = m;
  $("#cmdkList").innerHTML = m.length
    ? m.map((c, i) => `<button class="cmdk-item ${i === state.cmdkSel ? "sel" : ""}" data-cmdk="${i}">${esc(c.label)}<span class="k">${esc(c.key)}</span></button>`).join("")
    : `<div class="empty" style="border:0">Nothing matches.</div>`;
}

/* ---------------------------------------------------------------- actions */
function go(view) { state.view = view; state.selectedRun = null; render(); window.scrollTo({ top: 0, behavior: state.skin.motion === "none" ? "auto" : "smooth" }) }
function newSession(opts = {}) {
  const s = { id: uid("sess"), title: opts.temporary ? "Temporary chat" : "New session", created: ts(), updated: ts(), messages: [], temporary: !!opts.temporary };
  state.sessions.unshift(s); state.currentSessionId = s.id; state.currentSwarmId = null;
  state.draft = ""; state.livePreview = "";
  if (window.innerWidth < 900) state.chatsOpen = false;
  saveSession(s); go("orchestrator"); toast(opts.temporary ? "Temporary chat — nothing here is saved." : "New session.");
}
async function send() {
  const ta = $("#chatInput");
  let text = (ta?.value || state.draft || "").trim();
  if (!text && !state.pendingAttachments.length) { toast("Write something first."); return }

  // /ops <lane> jumps straight to a lane without troubling the orchestrator.
  const opsMatch = text.match(/^\/ops\s+([a-z0-9_-]+)\s*([\s\S]*)$/i);
  if (opsMatch) {
    const lane = OPS.find(o => o.key === opsMatch[1]);
    if (lane) {
      state.draft = ""; if (ta) ta.value = "";
      state.view = "ops"; state.opsQuery = lane.title; render();
      toast("Running " + lane.title + "…");
      const r = await runOpsLane(lane.key, opsMatch[2] || lane.placeholder, { includeWorkspace: state.settings.includeWorkspace });
      if (!r.ok) toast("Lane failed.");
      return;
    }
  }

  const attachments = state.pendingAttachments.splice(0);
  state.draft = ""; if (ta) ta.value = "";
  await runOrchestrator(text, attachments);
}
function exportRunMd() {
  const sw = currentSwarm();
  if (!sw) { toast("No run to export."); return }
  download(`swarm-run-${sw.id}.md`, runMarkdown(sw), "text/markdown");
}

/* ---------------------------------------------------------------- binding */
function bind() {
  const app = document.body;

  app.addEventListener("click", async e => {
    const t = e.target.closest("[data-nav],[data-action],[data-example],[data-open-artifact],[data-open-session],[data-open-swarm],[data-replay-swarm],[data-open-run],[data-toggle-agent],[data-copy-agent],[data-artifact-agent],[data-rerun-agent],[data-copy-code],[data-ops-run],[data-ops-swarm],[data-pin-file],[data-view-file],[data-del-file],[data-del-memory],[data-monitor-src],[data-arena-pick],[data-model-tile],[data-skin-base],[data-restore-version],[data-cmdk],[data-approve],[data-deny],[data-toggle-skill],[data-toggle-skill-on],[data-del-skill],[data-download-skill],[data-provider],[data-sbx-use],[data-sbx-kill],[data-cli]");
    if (!t) return;
    const d = t.dataset;

    if (d.nav) return go(d.nav);
    if (d.example) { state.draft = d.example; render(); $("#chatInput")?.focus(); return }
    if (d.cmdk != null) { const c = state._cmdkMatches?.[Number(d.cmdk)]; closeCmdk(); c?.run(); return }

    if (d.toggleAgent) { t.closest(".agent-card")?.classList.toggle("open"); return }
    if (d.copyAgent) { const a = findAgent(d.copyAgent); return copyText(a?.output || "") }
    if (d.artifactAgent) {
      const a = findAgent(d.artifactAgent); if (!a) return;
      await addArtifact({ name: `${a.role}-${a.id.slice(-6)}.md`, language: "markdown", content: a.output, source: "agent", swarmId: a.swarmId });
      toast("Saved as an artifact."); return;
    }
    if (d.rerunAgent) {
      const a = findAgent(d.rerunAgent); const sw = currentSwarm();
      if (!a || !sw) return;
      if (RUN.active) { toast("Wait for the current run to finish.") ; return }
      RUN.abort = new AbortController(); RUN.active = true; render();
      await runAgent({ role: a.role, model: a.model, task: a.task, done_criteria: a.doneCriteria }, sw);
      RUN.active = false; RUN.abort = null; render(); return;
    }
    if (d.copyCode != null) { const pre = document.querySelector(`[data-code="${d.copyCode}"]`); return copyText(pre?.innerText || "") }
    if (d.openArtifact) { state.selectedArtifact = d.openArtifact; state.artifactPreview = false; return go("artifacts") }
    if (d.openSession) { if (window.innerWidth < 900) state.chatsOpen = false; state.currentSessionId = d.openSession; const sw = state.swarms.find(x => x.sessionId === d.openSession); state.currentSwarmId = sw?.id || null; return go("orchestrator") }
    if (d.openSwarm) { state.currentSwarmId = d.openSwarm; return go("swarm") }
    if (d.replaySwarm) {
      const sw = state.swarms.find(x => x.id === d.replaySwarm);
      if (!sw) return;
      state.draft = sw.objective; go("orchestrator");
      toast("Objective loaded — press Send to replay it with the current line-up."); return;
    }
    if (d.openRun) { state.selectedRun = d.openRun; return render() }
    if (d.opsRun) { return doOpsRun(d.opsRun, false) }
    if (d.opsSwarm) {
      const lane = OPS.find(o => o.key === d.opsSwarm);
      const input = ($(`#ops-${safeCss(d.opsSwarm)}`)?.value || "").trim();
      state.draft = `Run the "${lane.title}" workflow as a swarm.\n\n${MODE_PROMPTS[lane.mode] || ""}\n\nSubject:\n${input || lane.placeholder}`;
      go("orchestrator"); toast("Loaded into the orchestrator — press Send."); return;
    }
    if (d.pinFile) { const f = state.files.find(x => x.id === d.pinFile); if (f) { f.selected = !f.selected; await DB.put("files", f) } return render() }
    if (d.viewFile) { state.viewFile = state.files.find(x => x.id === d.viewFile); return render() }
    if (d.delFile) { state.files = state.files.filter(x => x.id !== d.delFile); await DB.del("files", d.delFile); return render() }
    if (d.delMemory) { state.memories = state.memories.filter(x => x.id !== d.delMemory); await DB.del("memories", d.delMemory); return render() }
    if (d.monitorSrc) { state.monitorSource[d.monitorSrc] = !state.monitorSource[d.monitorSrc]; return render() }
    if (d.arenaPick) {
      const cur = state.arenaPick || [state.settings.orchestratorModel, state.settings.defaultAgentModel].filter(Boolean);
      state.arenaPick = cur.includes(d.arenaPick) ? cur.filter(x => x !== d.arenaPick) : [...cur, d.arenaPick];
      state.arenaDraft = $("#arenaPrompt")?.value || state.arenaDraft;
      render(); if ($("#arenaPrompt") && state.arenaDraft) $("#arenaPrompt").value = state.arenaDraft;
      return;
    }
    if (d.modelTile) { state.settings.orchestratorModel = d.modelTile; await saveSettings(); toast("Orchestrator set to " + d.modelTile); return render() }
    if (d.skinBase) { applySkin({ ...readSkinFromUI(), base: d.skinBase }); return render() }
    if (d.restoreVersion) {

      const a = state.artifacts.find(x => x.id === id);
      const h = a?.history?.find(x => String(x.version) === v);

      return;
    }
    if (d.sbxUse) { state.sbxId = d.sbxUse; return render() }
    if (d.sbxKill) { await sandboxCall("destroy", { id: d.sbxKill }); if (state.sbxId === d.sbxKill) state.sbxId = null; return doAction("sandbox-list") }
    if (d.approve) return resolveApproval(d.approve, true);
    if (d.deny) return resolveApproval(d.deny, false);
    if (d.toggleSkill) { t.closest(".agent-card")?.classList.toggle("open"); return }
    if (d.toggleSkillOn) {
      const sk = (state.skills || []).find(x => x.id === d.toggleSkillOn);
      if (sk) { sk.enabled = !sk.enabled; await DB.put("skills", sk); render() }
      return;
    }
    if (d.delSkill) {
      state.skills = (state.skills || []).filter(x => x.id !== d.delSkill);
      await DB.del("skills", d.delSkill); return render();
    }
    if (d.downloadSkill) {
      const sk = (state.skills || []).find(x => x.id === d.downloadSkill);

    }

  });

    const el = e.target, d = el.dataset;

    if (el.id === "fileSearch") { state.fileFilter = el.value; return scheduleRender(220) }
    if (el.id === "modelSearch") { state.modelQuery = el.value; return scheduleRender(220) }
    if (d.key) { state.keys[d.key] = el.value.trim(); saveKeys(); return }
    if (d.searchKey) { state.searchKeys[d.searchKey] = el.value.trim(); saveKeys(); return }
    if (el.id === "skillBrief") { state.skillBrief = el.value; return }
    if (el.id === "beaconSearch") { state.beaconQuery = el.value; return scheduleRender(250) }
    if (el.id === "sbxCmd") { state.sbxCmd = el.value; return }
    if (el.id === "sbxFrom") { state.sbxFrom = el.value; return }
    if (el.id === "cmdkInput") { state.cmdkSel = 0; return renderCmdk(el.value) }

    if (d.skinText) { const v = normHex(el.value, state.skin[d.skinText]); if (/^#[0-9a-f]{6}$/i.test(v)) { const k = { ...readSkinFromUI() }; k[d.skinText] = v; applySkin(k) } return }

  });

  app.addEventListener("change", async e => {
    const el = e.target, d = el.dataset;
    if (el.id === "opsMode") { state.opsFilter = el.value; return render() }
    if (el.id === "providerFilter") { state.providerFilter = el.value; return render() }
    if (d.rule) {
      const rules = (state.settings.jevRules || DEFAULT_RULES).map(r => r.id === d.rule ? { ...r, enabled: el.checked } : r);
      state.settings.jevRules = rules; await saveSettings(); return render();
    }
    if (el.id === "hiddenSkills") { await importSkillFiles(el.files); el.value = ""; return }
    if (d.skillScope) { const sk = (state.skills || []).find(x => x.id === d.skillScope); if (sk) { sk.scope = el.value; await DB.put("skills", sk); render() } return }
    if (d.skillSrc) {
      state.skillSources = state.skillSources || [];
      state.skillSources = el.checked ? [...state.skillSources, d.skillSrc] : state.skillSources.filter(x => x !== d.skillSrc);
      return;
    }
    if (el.id === "chatFiles") { await attachToChat(el.files); return }
    if (el.id === "hiddenFiles" || el.id === "hiddenFolder") { await importFiles(el.files); el.value = ""; return }
    if (el.id === "hiddenBundle") { const f = el.files[0]; if (f) await importWorkspace(await f.text()); el.value = ""; return }
    if (d.skinSet) { applySkin(readSkinFromUI()); return render() }
    if (d.set) {
      state.settings[d.set] = el.type === "checkbox" ? el.checked : el.value;
      if (d.set === "preset" && ORCH_PRESETS[el.value]) {

      }
      if (d.set === "blueprint") toast(BLUEPRINTS[el.value]?.desc || "");
      await saveSettings();
      if (["preset", "transport", "orchestratorModel"].includes(d.set)) render();

  // keyboard
  document.addEventListener("keydown", e => {
    const typing = ["input", "textarea", "select"].includes((e.target.tagName || "").toLowerCase());
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); return state.cmdkOpen ? closeCmdk() : openCmdk() }
    if (state.cmdkOpen) {
      const m = state._cmdkMatches || [];
      if (e.key === "Escape") { e.preventDefault(); return closeCmdk() }
      if (e.key === "ArrowDown") { e.preventDefault(); state.cmdkSel = Math.min(m.length - 1, state.cmdkSel + 1); return renderCmdk($("#cmdkInput").value) }
      if (e.key === "ArrowUp") { e.preventDefault(); state.cmdkSel = Math.max(0, state.cmdkSel - 1); return renderCmdk($("#cmdkInput").value) }
      if (e.key === "Enter") { e.preventDefault(); const c = m[state.cmdkSel]; closeCmdk(); return c?.run() }
      return;
    }
    if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key.toLowerCase() === "a") {
      e.preventDefault();
      return doAction(state.layout === "simple" ? "layout-advanced" : "layout-simple");
    }
    if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); return send() }
    if (e.key === "Enter" && !e.shiftKey && state.layout === "simple" && e.target && e.target.id === "chatInput") {
      e.preventDefault(); return send();
    }
    if (e.key === "Escape" && RUN.active) { e.preventDefault(); return stopRun() }
    if (e.altKey && !typing && /^[1-9]$/.test(e.key)) { const v = VIEWS[Number(e.key) - 1]; if (v) { e.preventDefault(); go(v.id) } }
  });

  $("#cmdk").addEventListener("click", e => { if (e.target.id === "cmdk") closeCmdk() });
  window.addEventListener("resize", () => { if (["monitor", "workspace", "swarm"].includes(state.view)) scheduleRender(250) });
  window.addEventListener("beforeunload", e => { if (RUN.active) { e.preventDefault(); e.returnValue = "" } });
}

async function doOpsRun(key) {
  const input = ($(`#ops-${safeCss(key)}`)?.value || "").trim();
  const lane = OPS.find(o => o.key === key);
  if (!input) { toast("Give the lane something to work on."); return }
  const outEl = $(`#opsout-${safeCss(key)}`);
  if (outEl) { outEl.classList.add("show"); outEl.innerHTML = `<span class="typing"><i></i><i></i><i></i></span> ${esc(lane.title)} running…` }
  if (!RUN.abort) { RUN.abort = new AbortController(); RUN.metrics = emptyMetrics() }
  const r = await runOpsLane(key, input, { includeWorkspace: state.settings.includeWorkspace });
  RUN.abort = null;
  if (!r.ok) toast("Lane failed: " + String(r.error).slice(0, 80));
  render();
}

/* ---------------------------------------------------------------- selftest
   Real assertions against live behaviour, not a checklist that always passes.
   Anything that fails is reported as failed. */
function selfTest() {
  const results = [];
  const check = (name, fn) => { try { const r = fn(); results.push({ name, pass: r === true, detail: r === true ? "" : String(r) }) } catch (e) { results.push({ name, pass: false, detail: e.message }) } };

  check("Storage is reachable", () => DB.db || DB.fallback ? true : "neither IndexedDB nor localStorage is available");
  check("Every view renders without throwing", () => {
    const keep = state.view;
    for (const v of VIEWS) { state.view = v.id; const html = renderView(); if (typeof html !== "string" || !html.length) { state.view = keep; return "view '" + v.id + "' produced nothing" } }
    state.view = keep; return true;
  });

    const prev = state.keys.openrouter; state.keys.openrouter = "sk-or-secret-value";
    const out = exportWorkspace(false); state.keys.openrouter = prev;
    return out.includes("sk-or-secret-value") ? "the key leaked into the export" : true;
  });

  const pass = results.filter(r => r.pass).length;
  const fail = results.length - pass;
  const html = `<div class="grid">
    ${hero("Self-test", `${pass} of ${results.length} checks passed${fail ? ` · <b style="color:var(--danger)">${fail} failed</b>` : " · everything green"}.`,
      `<button class="btn" data-action="self-test">Run again</button><button class="btn" data-nav="orchestrator">Back to the chat</button>`)}
    <div class="panel"><table class="data"><thead><tr><th>Check</th><th>Result</th><th>Detail</th></tr></thead><tbody>
      ${results.map(r => `<tr><td>${esc(r.name)}</td><td><span class="pill ${r.pass ? "ok" : "bad"}">${r.pass ? "pass" : "FAIL"}</span></td><td class="subtle">${esc(r.detail)}</td></tr>`).join("")}
    </tbody></table></div>
  </div>`;
  $("#app").innerHTML = `<div class="app">${renderRail()}<div class="stage">${html}</div></div>`;
  toast(fail ? `${fail} check${fail === 1 ? "" : "s"} failed.` : "All checks passed.");
  logEvent("test", "Self-test", { level: fail ? "error" : "info", pass, fail });
  return { pass, fail, results };
}

/* -------------------------------------------------------------------- boot */
async function boot() {
  await DB.open();

  const savedSkin = LS.get("swarmos.skin", "");
  if (savedSkin) { try { state.skin = { ...defaultSkin(), ...JSON.parse(savedSkin) } } catch {} }
  applySkin(state.skin, false);

  const savedSettings = await getKV("settings");
  if (savedSettings) state.settings = { ...DEFAULT_SETTINGS, ...savedSettings };
  LS.remove("swarmos.key");                 // retired by the per-provider key store
  state.keys = (await getKV("keys")) || {};
  state.searchKeys = (await getKV("searchKeys")) || {};

  const [sessions, swarms, runs, files, artifacts, events, memories, skills] = await Promise.all([
    DB.all("sessions"), DB.all("swarms"), DB.all("runs"),
    DB.all("files"), DB.all("artifacts"), DB.all("events"), DB.all("memories"), DB.all("skills")
  ]);
  state.skills = skills.sort((a, b) => new Date(b.created || 0) - new Date(a.created || 0));
  state.decisions = (await DB.all("decisions")).sort((a, b) => new Date(b.at || 0) - new Date(a.at || 0)).slice(0, 500);
  state.layout = state.settings.layout || "simple";
  const byDate = (a, b) => new Date(b.created || b.updated || 0) - new Date(a.created || a.updated || 0);
  state.sessions = sessions.sort((a, b) => new Date(b.updated || 0) - new Date(a.updated || 0));
  state.swarms = swarms.sort(byDate);
  state.runs = runs.sort(byDate);
  state.files = files.sort(byDate);
  state.artifacts = artifacts.sort(byDate);
  state.events = events.sort(byDate).slice(0, 400);
  state.memories = memories.sort(byDate);
  if (state.sessions.length) state.currentSessionId = state.sessions[0].id;

  const cached = await getKV("modelsCache");
  if (cached?.byProvider) {
    state.modelsByProvider = cached.byProvider;
    state.models = Object.values(cached.byProvider).flat();
    state.modelsLoadedAt = cached.loadedAt;
  }

  // Finish an OpenRouter sign-in if we were redirected back with a code.
  const qs = new URLSearchParams(location.search);
  if (qs.get("code")) {
    const ok = await completeOpenRouterOAuth(qs.get("code"));
    history.replaceState({}, "", location.pathname);
    if (ok) state.view = "providers";
  }

  // Inside the macOS app the bridge is built in: take its URL and this
  // launch's token instead of asking anyone to paste one.
  if (NATIVE && NATIVE.bridgeUrl && NATIVE.token) {
    state.settings.bridgeUrl = NATIVE.bridgeUrl;
    state.settings.bridgeToken = NATIVE.token;
    state.settings.bridgeAuto = true;
  }

  if (HOSTED && (!state.settings.bridgeUrl || state.settings.bridgeUrl === DEFAULT_SETTINGS.bridgeUrl)) state.settings.bridgeUrl = location.origin;
  if (HOSTED && !state.settings.bridgeToken) {
    // Is there a cloud bridge here? 401 = yes, waiting for its token; 503 = deployed but not set up.
    fetch(location.origin + "/v1/hello").then(r => { state.bridge.cloudAvailable = r.status === 401 ? "yes" : r.status === 503 ? "unconfigured" : "no"; scheduleRender() }).catch(() => {});
  }
  if (state.settings.bridgeAuto && state.settings.bridgeToken) {
    await bridgeHello(true);
    if (state.bridge.connected && state.settings.beaconAuto) beaconPull({ limit: 200 });
  }
  for (const srv of mcpServers()) if (srv.enabled !== false) mcpConnect(srv, true);

  // First run with no paid provider but a free route available: start in free
  // mode on that route rather than on a blank "no provider" screen. Runs once;
  // after that the user's own choices stand.
  if (state.settings.freeAutoSetup && state.bridge.connected) {
    const paid = configuredProviders().filter(pid => !(providerCfg(pid).local || providerCfg(pid).free) && providerCfg(pid).wire !== "cli");
    if (!paid.length && freeCandidates().length) {
      state.settings.freeMode = true;
      await applyFreeLineup(true);
      state.settings.freeAutoSetup = false;
      await saveSettings();
      setTimeout(() => toast("No paid keys found — running free on " + refLabel(state.settings.orchestratorModel) + ". See Free AI for options."), 400);
    }
  }

  state.ready = true;
  bind();
  dockMount();
  // Installable web app. Not inside the Mac app (it is already an app) and not
  // from file:// (service workers need http or https).
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && !NATIVE) navigator.serviceWorker.register("sw.js").catch(() => {});
  window.addEventListener("resize", () => dockSchedule(true));
  render();

  // Refresh the catalogue in the background; stale entries are the usual reason
  // a model id "does not exist" when it actually does.
  const age = state.modelsLoadedAt ? Date.now() - new Date(state.modelsLoadedAt).getTime() : Infinity;
  if (age > 6 * 3600 * 1000) loadModels(true);

  // Notice a local model server started after launch (the native app only —
  // a browser tab would otherwise poll a bridge that may not exist).
  if (NATIVE) setInterval(async () => {
    if (RUN.active) return;
    const before = JSON.stringify((state.bridge.localServers || []).map(l => [l.provider, (l.models || []).length]));
    await bridgeHello(true);
    const after = JSON.stringify((state.bridge.localServers || []).map(l => [l.provider, (l.models || []).length]));
    if (before !== after) render();
  }, 20000);

  await logEvent("boot", APP + " " + APP_VERSION + " ready", { level: "info", storage: DB.fallback ? "localStorage" : "IndexedDB" });
  console.log(`%c${APP} ${APP_VERSION}`, "font-weight:700", "— orchestrator + swarm harness ready.");
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

/* Exposed for debugging from the console and for the self-test harness. */
window.SWARM = {
  state, RUN, render, DB, selfTest, md, doAction, currentSession, applySkin, MCP, mcpConnect, mcpCallTool, mcpToolSchemas, orchestratorTools, domainAllowed, judgePanel, requestPreview, diagnostics, artifactTool, recordSources, msgView, ratingBoard, promptLib, extractMath,
  callModel, callOR, runAgent, runOrchestrator, dispatchTool,
  TOOL_SCHEMAS, AGENT_TOOLS, ROLES, BLUEPRINTS, OPS,
  PROVIDERS, PROVIDER_IDS, parseRef, makeRef, providerReady, providerBlocker, configuredProviders,
  buildOpenAIBody, buildAnthropicBody, toAnthropic, parseAnthropicResponse, consumeAnthropicStream,
  webSearch, fetchUrl, SEARCH_ENGINES, activeSearchEngine,
  bridgeHello, bridgeSource, LIVE, scanFences, artifactBlocks, partialJsonField, artifactSrcdoc, dockOpen, liveFromText, isFreeRef, freeCandidates, freeGate, applyFreeLineup, NATIVE, parseSkill, skillMarkdown, skillsPreamble, createSkillWithModel,
  verifyDoD, fallbackDoD, startOpenRouterOAuth, completeOpenRouterOAuth,
  jevAsk, jevReady, normaliseJev, jevRoute, jevGate, jevScoreWork, hybridJudge,
  jevLifecycleReview, jevPlanRoster, jevCheckDoD, agentValue, localDifficulty,
  JEV_BANDS, DEFAULT_TIERS, DEFAULT_RULES, resolveTiers, recordDecision,
  beaconPull, beaconPush, beaconMemory, sandboxCall, bskRun, wrapUntrusted,
  renderSimple, renderJev
};

})();
</script>

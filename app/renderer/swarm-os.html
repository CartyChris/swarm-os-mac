/* ========================================================== SANDBOXES
 * The pattern Greptile's TREX popularised: give a review agent its own throwaway
 * computer, let it actually run the change, and return evidence instead of an
 * opinion. This is a local reimplementation of that idea, not an integration
 * with their product.
 *
 * Everything is confined under the sandbox root, the whole feature is off until
 * you pass --allow-sandbox, and a small denylist refuses the commands that are
 * only ever destructive.
 */
export const CMD_DENY = /(^|[;&|\s])(rm\s+-rf\s+\/(?!\w)|mkfs|dd\s+if=|shutdown|reboot|halt|:\(\)\{|chmod\s+-R\s+777\s+\/|curl[^|]*\|\s*(ba)?sh|wget[^|]*\|\s*(ba)?sh)/i;

const APP_ASSETS = { "/manifest.webmanifest": "application/manifest+json", "/sw.js": "text/javascript; charset=utf-8" };

/* ================================================================ BRIDGE */
export async function startBridge(opts = {}) {
  const env = opts.env || process.env;
  const HOME = opts.home || os.homedir();
  const PORT = opts.port === undefined ? 8787 : Number(opts.port);
  const TOKEN = opts.token || crypto.randomBytes(18).toString("base64url");
  const ALLOW_CLI = !!opts.allowCli;
  const ALLOW_SANDBOX = !!opts.allowSandbox;
  const SANDBOX_ROOT = path.resolve(opts.sandboxRoot || path.join(HOME, ".swarm-os", "sandboxes"));
  const SKILLS_DIR = path.resolve(opts.skillsDir || path.join(HOME, ".swarm-os", "skills"));
  const APP_FILE = opts.serveApp ? path.resolve(opts.serveApp) : null;
  const ALLOWED_HOSTS = new Set(DEFAULT_ALLOWED_HOSTS.concat(opts.allowHosts || []));
  const BEACON_LOG = path.join(HOME, ".beacon", "endpoint", "logs", "runtime.jsonl");
  const whichSync = makeWhich(env);
  const log = opts.quiet ? () => {} : (...a) => console.log(...a);

  /* ---------------------------------------------------- AGENT BEACON
   * Beacon records agent sessions across Claude Code, Cursor, Codex, OpenCode
   * and the rest into one JSONL event log. Reading it is what lets SWARM OS
   * remember what happened in your OTHER harnesses, not just its own chats.
   */
  function beaconStatus() {
    const installed = !!whichSync("beacon");
    let events = 0, bytes = 0, newest = null;
    try {
      const st = fs.statSync(BEACON_LOG);
      bytes = st.size; newest = st.mtime.toISOString();
    } catch { /* not installed or never run */ }
    return { installed, logPath: BEACON_LOG.startsWith(HOME) ? "~" + BEACON_LOG.slice(HOME.length) : BEACON_LOG, present: bytes > 0, bytes, newest, events };
  }
  /* Tail the log without loading a large file into memory. */
  function beaconRead(limit, since, query) {
    let raw = "";
    try {
      const fd = fs.openSync(BEACON_LOG, "r");
      const size = fs.fstatSync(fd).size;
      const want = Math.min(size, 4 * 1024 * 1024);
      const buf = Buffer.alloc(want);
      fs.readSync(fd, buf, 0, want, size - want);
      fs.closeSync(fd);
      raw = buf.toString("utf8");
      if (want < size) raw = raw.slice(raw.indexOf("\n") + 1);   // drop the partial first line
    } catch (e) { return { ok: false, error: "Beacon log not readable: " + e.message }; }
    const q = String(query || "").toLowerCase();
    const out = [];
    for (const line of raw.split("\n")) {
      if (!line.trim()) continue;
      let j; try { j = JSON.parse(line); } catch { continue; }
      if (since && (j.timestamp || j.time || j.ts || "") < since) continue;
      if (q && !JSON.stringify(j).toLowerCase().includes(q)) continue;
      out.push(j);
    }
    return { ok: true, total: out.length, events: out.slice(-(limit || 200)) };
  }
  /* Append our own runs in the same shape, so SWARM OS work shows up in
     Beacon's dashboard beside every other harness. */
  function beaconWrite(events) {
    try {
      fs.mkdirSync(path.dirname(BEACON_LOG), { recursive: true });
      const lines = (events || []).map((e) => JSON.stringify(Object.assign({ source: "swarm-os", timestamp: new Date().toISOString() }, e))).join("\n");
      if (lines) fs.appendFileSync(BEACON_LOG, lines + "\n", "utf8");
      return { ok: true, written: (events || []).length };
    } catch (e) { return { ok: false, error: e.message }; }
  }

  const SANDBOXES = new Map();
  function sandboxPath(id) {
    const safe = String(id || "").replace(/[^a-zA-Z0-9_-]/g, "");
    if (!safe) return null;
    const p = path.join(SANDBOX_ROOT, safe);
    const rel = path.relative(SANDBOX_ROOT, p);
    return (rel.startsWith("..") || path.isAbsolute(rel)) ? null : p;
  }

  function detectClis() {
    return Object.entries(CLI_AGENTS).map(([id, c]) => {
      const bin = whichSync(c.bin);
      return { id, label: c.label, bin: c.bin, path: bin || null, installed: !!bin, note: c.note, argv: c.argv };
    });
  }

  /* ------------------------------------------------------------- HTTP I/O */
  function cors(res) {
    res.setHeader("Access-Control-Allow-Origin", "*");
    res.setHeader("Access-Control-Allow-Headers", "Content-Type, X-Swarm-Token");
    res.setHeader("Access-Control-Allow-Methods", "GET, POST, OPTIONS");
    res.setHeader("Access-Control-Max-Age", "86400");
  }
  function send(res, code, obj) {
    if (res.headersSent) { try { res.end(); } catch { /* already closed */ } return; }
    cors(res);
    res.writeHead(code, { "Content-Type": "application/json" });
    res.end(JSON.stringify(obj));
  }
  function body(req) {
    return new Promise((resolve, reject) => {
      let b = "";
      req.on("data", (c) => {
        b += c;
        if (b.length > 25 * 1024 * 1024) { reject(new Error("body too large")); req.destroy(); }
      });
      req.on("end", () => resolve(b));
      req.on("error", reject);
    });
  }
  const tokenBuf = Buffer.from(TOKEN);
  const authed = (req) => {
    const got = Buffer.from(String(req.headers["x-swarm-token"] || ""));
    return got.length === tokenBuf.length && crypto.timingSafeEqual(got, tokenBuf);
  };
  let boundPort = PORT;
  /* A page on some other site can make the browser resolve its own hostname to
     127.0.0.1. Refusing any Host that is not this listener closes that door. */
  const hostOk = (req) => {
    const h = String(req.headers.host || "").toLowerCase();
    return h === "127.0.0.1:" + boundPort || h === "localhost:" + boundPort;
  };

  let CREDS = discoverCredentials(HOME, env);
  let CLIS = detectClis();
  let LOCALS = [];
  let localsAt = 0;
  async function refreshLocals(force) {
    if (!force && Date.now() - localsAt < 5000) return LOCALS;
    LOCALS = await (opts.detectLocalServers || detectLocalServers)();
    localsAt = Date.now();
    return LOCALS;
  }

  function hello() {
    const cont = CREDS.continue;
    return {
      ok: true, version: VERSION, node: process.version, platform: process.platform,
      native: !!opts.native,
      allowCli: ALLOW_CLI, skillsDir: SKILLS_DIR,
      allowSandbox: ALLOW_SANDBOX, sandboxRoot: SANDBOX_ROOT,
      beacon: beaconStatus(),
      // provider ids this bridge can authenticate on the browser's behalf
      providers: Object.keys(CREDS.found),
      searchProviders: Object.keys(CREDS.search),
      // names and sources only. Values never leave this process.
      cli: Object.entries(CREDS.found).map(([p, v]) => ({ provider: p, source: v.source, preview: redact(v.key) })),
      searchCli: Object.entries(CREDS.search).map(([p, v]) => ({ provider: p, source: v.source, preview: redact(v.key) })),
      clis: CLIS, localServers: LOCALS,
      // apiBase can itself come from a secret, so the page only learns whether one is set.
      continue: {
        present: cont.present, file: cont.file, hubRefs: cont.hubRefs,
        models: cont.models.map(({ apiBase, ...m }) => ({ ...m, customApiBase: !!apiBase }))
      },
      allowed: Array.from(ALLOWED_HOSTS)
    };
  }

  /* ---------------------------------------------------------------- routes */
  const server = http.createServer(async (req, res) => {
    if (!hostOk(req)) { res.writeHead(421, { "Content-Type": "text/plain" }); return res.end("Misdirected request."); }
    if (req.method === "OPTIONS") { cors(res); res.writeHead(204); return res.end(); }

    const url = new URL(req.url, "http://127.0.0.1");

    /* The app itself. Served from the same loopback origin so the page has a
       stable http:// home (IndexedDB persists, OpenRouter's OAuth redirect has
       somewhere to land). It contains no secrets; the token is not in it. */
    if (APP_FILE && req.method === "GET" && (url.pathname === "/" || url.pathname === "/index.html")) {
      const html = readText(APP_FILE);
      if (!html) return send(res, 500, { ok: false, error: "App file missing: " + APP_FILE });
      res.writeHead(200, {
        "Content-Type": "text/html; charset=utf-8", "Cache-Control": "no-store",
        "X-Frame-Options": "DENY", "Referrer-Policy": "no-referrer"
      });
      return res.end(html);
    }
    /* The app's installable-web-app files, from the same folder. A fixed list,
       so nothing else beside the app is reachable. */
    if (APP_FILE && req.method === "GET" && (APP_ASSETS[url.pathname] || /^\/icons\/[a-z0-9-]+\.png$/.test(url.pathname))) {
      const file = path.join(path.dirname(APP_FILE), url.pathname.slice(1));
      if (path.relative(path.dirname(APP_FILE), file).startsWith("..")) return send(res, 404, { ok: false, error: "No such route." });
      let data;
      try { data = fs.readFileSync(file); } catch { return send(res, 404, { ok: false, error: "No such file." }); }
      res.writeHead(200, { "Content-Type": APP_ASSETS[url.pathname] || "image/png", "Cache-Control": url.pathname === "/sw.js" ? "no-cache" : "public, max-age=3600" });
      return res.end(data);
    }

    if (url.pathname === "/v1/hello") {
      if (!authed(req)) return send(res, 401, { ok: false, error: "Bad or missing pairing token." });
      CREDS = discoverCredentials(HOME, env);
      CLIS = detectClis();
      await refreshLocals(url.searchParams.get("rescan") === "1");
      return send(res, 200, hello());
    }

    if (url.pathname === "/v1/proxy" && req.method === "POST") {
      if (!authed(req)) return send(res, 401, { ok: false, error: "Bad or missing pairing token." });
      let payload;
      try { payload = JSON.parse(await body(req)); } catch { return send(res, 400, { ok: false, error: "Body was not JSON." }); }
      let target;
      try { target = new URL(payload.target); } catch { return send(res, 400, { ok: false, error: "Bad target URL." }); }
      if (target.protocol !== "https:" && target.protocol !== "http:") return send(res, 400, { ok: false, error: "Only http and https targets." });
      if (!ALLOWED_HOSTS.has(target.hostname)) {
        return send(res, 403, { ok: false, error: "Host not allow-listed: " + target.hostname + ". Restart with --allow-host " + target.hostname + " if you meant it." });
      }
      const headers = Object.assign({}, payload.headers || {});
      delete headers.host; delete headers.Host; delete headers["content-length"]; delete headers["Content-Length"];

      // Attach a discovered credential here so the browser never holds it —
      // and only when the request is going to that credential's own provider.
      const credFor = (name, table) => {
        if (!name || !table[name]) return {};
        const hosts = CREDENTIAL_HOSTS[name] || [];
        if (!hosts.includes(target.hostname)) {
          return { error: "The " + name + " credential is only sent to " + (hosts.join(", ") || "its own provider") + ", not " + target.hostname + "." };
        }
        return { key: table[name].key };
      };
      const model = credFor(payload.credential, CREDS.found);
      if (model.error) return send(res, 403, { ok: false, error: model.error });
      if (model.key) {
        if (payload.credential === "anthropic") { headers["x-api-key"] = model.key; headers["anthropic-version"] = headers["anthropic-version"] || "2023-06-01"; }
        else headers.Authorization = "Bearer " + model.key;
      }
      const search = credFor(payload.searchCredential, CREDS.search);
      if (search.error) return send(res, 403, { ok: false, error: search.error });
      if (search.key) {
        const sc = payload.searchCredential;
        if (sc === "serper") headers["X-API-KEY"] = search.key;
        else if (sc === "brave") headers["X-Subscription-Token"] = search.key;
        else if (sc === "exa") headers["x-api-key"] = search.key;
        else headers.Authorization = "Bearer " + search.key;
      }

      const lib = target.protocol === "http:" ? http : https;
      const up = lib.request(
        { hostname: target.hostname, port: target.port || (target.protocol === "http:" ? 80 : 443), path: target.pathname + target.search, method: payload.method || "POST", headers },
        (r) => {
          cors(res);
          const h = Object.assign({}, r.headers);
          delete h["content-encoding"]; delete h["content-length"];
          delete h["access-control-allow-origin"];
          // Expose-Headers lets the page read upstream headers such as Mcp-Session-Id.
          res.writeHead(r.statusCode || 502, Object.assign(h, { "Access-Control-Allow-Origin": "*", "Access-Control-Expose-Headers": "*" }));
          r.pipe(res);            // streams straight through, SSE included
        }
      );
      up.on("error", (e) => send(res, 502, { ok: false, error: "Upstream failed: " + e.message }));
      // Stop the upstream call when the page aborts (the Stop button).
      res.on("close", () => { if (!res.writableFinished) up.destroy(); });
      if (payload.body) up.write(typeof payload.body === "string" ? payload.body : JSON.stringify(payload.body));
      up.end();
      return;
    }

    /* Run an installed coding CLI as a swarm agent. Output streams back as
       JSONL so the app can show it arriving. */
    if (url.pathname === "/v1/cli/run" && req.method === "POST") {
      if (!authed(req)) return send(res, 401, { ok: false, error: "Bad or missing pairing token." });
      if (!ALLOW_CLI) return send(res, 403, { ok: false, error: opts.native ? "CLI agents are off. Turn them on from the menu bar: SWARM OS → Allow CLI Agents." : "CLI spawning is off. Restart the bridge with --allow-cli to enable it." });
      let p;
      try { p = JSON.parse(await body(req)); } catch { return send(res, 400, { ok: false, error: "Body was not JSON." }); }
      const def = CLI_AGENTS[p.cli];
      if (!def) return send(res, 400, { ok: false, error: "Unknown CLI: " + p.cli });
      const bin = whichSync(def.bin);
      if (!bin) return send(res, 404, { ok: false, error: def.label + " is not on PATH. Install it, or pick another agent." });

      const prompt = String(p.prompt || "").slice(0, 200000);
      if (!prompt) return send(res, 400, { ok: false, error: "Empty prompt." });

      let args = (Array.isArray(p.argv) && p.argv.length ? p.argv : def.argv).map((a) => fill(a, "prompt", prompt));
      if (p.model && def.modelFlag) args = args.concat(def.modelFlag.map((a) => fill(a, "model", p.model)));
      if (p.useSkills && def.skillsFlag && exists(SKILLS_DIR)) args = args.concat(def.skillsFlag.map((a) => fill(a, "skills", SKILLS_DIR)));

      const cwd = p.cwd && exists(p.cwd) ? p.cwd : (opts.cwd || process.cwd());
      cors(res);
      res.writeHead(200, { "Content-Type": "application/x-ndjson", "Cache-Control": "no-cache" });
      const line = (o) => { try { res.write(JSON.stringify(o) + "\n"); } catch { /* client gone */ } };
      line({ type: "start", cli: p.cli, bin, args: args.map((a) => (a === prompt ? "<prompt>" : a)), cwd });

      const child = spawn(bin, args, { cwd, env, stdio: ["ignore", "pipe", "pipe"] });
      const killTimer = setTimeout(() => { try { child.kill("SIGTERM"); } catch { /* gone */ } }, Math.min(1800, Number(p.timeoutSec) || 600) * 1000);
      child.stdout.on("data", (d) => line({ type: "stdout", text: d.toString() }));
      child.stderr.on("data", (d) => line({ type: "stderr", text: d.toString() }));
      child.on("error", (e) => { line({ type: "error", error: e.message }); });
      child.on("close", (code) => { clearTimeout(killTimer); line({ type: "end", code }); res.end(); });
      // The client going away (Stop, or a closed window) ends the agent too.
      res.on("close", () => { clearTimeout(killTimer); if (child.exitCode === null) { try { child.kill("SIGTERM"); } catch { /* gone */ } } });
      return;
    }

    /* Write SWARM OS skills to disk so the CLIs can load the same folder with
       --skills-dir. Names are sanitised and confined to SKILLS_DIR. */
    if (url.pathname === "/v1/skills" && req.method === "POST") {
      if (!authed(req)) return send(res, 401, { ok: false, error: "Bad or missing pairing token." });
      let p;
      try { p = JSON.parse(await body(req)); } catch { return send(res, 400, { ok: false, error: "Body was not JSON." }); }
      const written = [];
      const rejected = [];
      for (const s of p.skills || []) {
        const rawName = String(s.name || "");
        if (/[\\/]|\.\./.test(rawName)) { rejected.push({ name: rawName, why: "path separators and .. are not allowed in a skill name" }); continue; }
        const safe = rawName.toLowerCase().replace(/[^a-z0-9._-]+/g, "-").replace(/^[.-]+/, "").slice(0, 64);
        if (!safe) { rejected.push({ name: rawName, why: "name has no usable characters" }); continue; }
        const dir = path.join(SKILLS_DIR, safe);
        const file = path.join(dir, "SKILL.md");
        const rel = path.relative(SKILLS_DIR, file);
        if (rel.startsWith("..") || path.isAbsolute(rel)) continue;   // no escaping the skills root
        fs.mkdirSync(dir, { recursive: true });
        fs.writeFileSync(file, String(s.content || ""), "utf8");
        written.push(rel);
      }
      return send(res, 200, { ok: true, dir: SKILLS_DIR, written, rejected });
    }
    if (url.pathname === "/v1/skills" && req.method === "GET") {
      if (!authed(req)) return send(res, 401, { ok: false, error: "Bad or missing pairing token." });
      const out = [];
      try {
        for (const d of fs.readdirSync(SKILLS_DIR, { withFileTypes: true })) {
          if (!d.isDirectory()) continue;
          const f = path.join(SKILLS_DIR, d.name, "SKILL.md");
          if (exists(f)) out.push({ name: d.name, content: readText(f).slice(0, 60000) });
        }
      } catch { /* directory may not exist yet */ }
      return send(res, 200, { ok: true, dir: SKILLS_DIR, skills: out });
    }

    /* ---- Agent Beacon ---- */
    if (url.pathname === "/v1/beacon" && req.method === "GET") {
      if (!authed(req)) return send(res, 401, { ok: false, error: "Bad or missing pairing token." });
      const st = beaconStatus();
      if (!st.present) return send(res, 200, Object.assign({ ok: true, events: [] }, st));
      const r = beaconRead(Number(url.searchParams.get("limit")) || 200, url.searchParams.get("since"), url.searchParams.get("q"));
      return send(res, 200, Object.assign({ ok: true }, st, r));
    }
    if (url.pathname === "/v1/beacon" && req.method === "POST") {
      if (!authed(req)) return send(res, 401, { ok: false, error: "Bad or missing pairing token." });
      let p; try { p = JSON.parse(await body(req)); } catch { return send(res, 400, { ok: false, error: "Body was not JSON." }); }
      return send(res, 200, beaconWrite(p.events));
    }

    /* ---- sandboxes ---- */
    if (url.pathname === "/v1/sandbox" && req.method === "POST") {
      if (!authed(req)) return send(res, 401, { ok: false, error: "Bad or missing pairing token." });
      if (!ALLOW_SANDBOX) return send(res, 403, { ok: false, error: opts.native ? "Sandboxes are off. Turn them on from the menu bar: SWARM OS → Allow Sandboxes." : "Sandboxes are off. Restart the bridge with --allow-sandbox to enable them." });
      let p; try { p = JSON.parse(await body(req)); } catch { return send(res, 400, { ok: false, error: "Body was not JSON." }); }

      if (p.op === "create") {
        const id = "sbx_" + crypto.randomBytes(6).toString("hex");
        const dir = sandboxPath(id);
        fs.mkdirSync(dir, { recursive: true });
        let seeded = null;
        if (p.from && exists(p.from)) {
          try { fs.cpSync(p.from, dir, { recursive: true, filter: (src) => !/[\\/](\.git|node_modules|\.next|dist|build|target)$/.test(src) }); seeded = p.from; }
          catch (e) { return send(res, 500, { ok: false, error: "Could not seed the sandbox: " + e.message }); }
        }
        SANDBOXES.set(id, { id, dir, created: new Date().toISOString(), seeded, runs: 0 });
        return send(res, 200, { ok: true, id, dir, seeded });
      }
      if (p.op === "exec") {
        const sb = SANDBOXES.get(p.id);
        if (!sb) return send(res, 404, { ok: false, error: "No such sandbox." });
        const cmd = String(p.command || "");
        if (!cmd.trim()) return send(res, 400, { ok: false, error: "Empty command." });
        if (CMD_DENY.test(cmd)) return send(res, 403, { ok: false, error: "Refused: that command is on the destructive denylist." });
        sb.runs++;
        const sh = process.platform === "win32" ? "cmd" : "sh";
        const shArgs = process.platform === "win32" ? ["/c", cmd] : ["-lc", cmd];
        const child = spawn(sh, shArgs, { cwd: sb.dir, env: Object.assign({}, env, { SWARM_SANDBOX: sb.id }) });
        let out = "", err = "", killed = false, done = false;
        const t = setTimeout(() => { killed = true; try { child.kill("SIGKILL"); } catch { /* gone */ } }, Math.min(600, Number(p.timeoutSec) || 120) * 1000);
        child.stdout.on("data", (d) => { if (out.length < 400000) out += d.toString(); });
        child.stderr.on("data", (d) => { if (err.length < 200000) err += d.toString(); });
        child.on("close", (code) => {
          clearTimeout(t);
          if (done) return; done = true;
          send(res, 200, { ok: !killed && code === 0, id: sb.id, exit: code, timedOut: killed, stdout: out.slice(-120000), stderr: err.slice(-40000) });
        });
        child.on("error", (e) => { clearTimeout(t); if (done) return; done = true; send(res, 500, { ok: false, error: e.message }); });
        return;
      }
      if (p.op === "read") {
        const sb = SANDBOXES.get(p.id);
        if (!sb) return send(res, 404, { ok: false, error: "No such sandbox." });
        const target = path.resolve(sb.dir, String(p.path || ""));
        const rel = path.relative(sb.dir, target);
        if (rel.startsWith("..") || path.isAbsolute(rel)) return send(res, 403, { ok: false, error: "Outside the sandbox." });
        return send(res, 200, { ok: true, path: rel, content: readText(target).slice(0, 200000) });
      }
      if (p.op === "write") {
        const sb = SANDBOXES.get(p.id);
        if (!sb) return send(res, 404, { ok: false, error: "No such sandbox." });
        const target = path.resolve(sb.dir, String(p.path || ""));
        const rel = path.relative(sb.dir, target);
        if (!rel || rel.startsWith("..") || path.isAbsolute(rel)) return send(res, 403, { ok: false, error: "Outside the sandbox." });
        fs.mkdirSync(path.dirname(target), { recursive: true });
        fs.writeFileSync(target, String(p.content || ""), "utf8");
        return send(res, 200, { ok: true, path: rel, bytes: String(p.content || "").length });
      }
      if (p.op === "destroy") {
        const sb = SANDBOXES.get(p.id);
        if (!sb) return send(res, 404, { ok: false, error: "No such sandbox." });
        try { fs.rmSync(sb.dir, { recursive: true, force: true }); } catch { /* already gone */ }
        SANDBOXES.delete(p.id);
        return send(res, 200, { ok: true, destroyed: p.id });
      }
      if (p.op === "list") {
        return send(res, 200, { ok: true, root: SANDBOX_ROOT, sandboxes: Array.from(SANDBOXES.values()).map((x) => ({ id: x.id, created: x.created, runs: x.runs, seeded: x.seeded })) });
      }
      return send(res, 400, { ok: false, error: "Unknown sandbox op." });
    }

    send(res, 404, { ok: false, error: "No such route." });
  });

  await new Promise((resolve, reject) => {
    server.once("error", reject);
    server.listen(PORT, "127.0.0.1", () => { server.off("error", reject); resolve(); });
  });
  boundPort = server.address().port;
  refreshLocals(true).catch(() => {});

  const creds = Object.keys(CREDS.found);
  const clis = CLIS.filter((c) => c.installed).map((c) => c.label);
  const bs = beaconStatus();
  log("");
  log("  SWARM OS Bridge " + VERSION + "  ->  http://127.0.0.1:" + boundPort);
  log("  " + "-".repeat(58));
  log("  Pairing token :  " + TOKEN);
  log("  Credentials   :  " + (creds.length ? creds.join(", ") : "none found"));
  log("  Search keys   :  " + (Object.keys(CREDS.search).join(", ") || "none found"));
  log("  Continue      :  " + (CREDS.continue.present ? CREDS.continue.file + " (" + CREDS.continue.models.length + " model(s))" : "no ~/.continue config"));
  log("  CLIs on PATH  :  " + (clis.length ? clis.join(", ") : "none found"));
  log("  CLI spawning  :  " + (ALLOW_CLI ? "ENABLED" : "off (pass --allow-cli)"));
  log("  Sandboxes     :  " + (ALLOW_SANDBOX ? "ENABLED -> " + SANDBOX_ROOT : "off (pass --allow-sandbox)"));
  log("  Agent Beacon  :  " + (bs.present ? bs.logPath + " (" + (bs.bytes / 1024).toFixed(0) + " KB)" : bs.installed ? "installed, no log yet" : "not found"));
  log("  Skills dir    :  " + SKILLS_DIR);
  if (APP_FILE) log("  App           :  http://127.0.0.1:" + boundPort + "/");
  log("");
  log("  Paste the pairing token into SWARM OS -> Providers -> Bridge.");
  log("  Credential values are never sent to the browser.");
  log("");

  return {
    port: boundPort, token: TOKEN, url: "http://127.0.0.1:" + boundPort, server,
    close: () => new Promise((resolve) => { server.closeAllConnections?.(); server.close(() => resolve()); })
  };
}

function rareTokens(s) {

async function parallelMap(items, limit, fn) {

/* ================================================================ callModel */

async function callModel(messages, opt = {}) {

  if (!opt.ignoreBudget && budgetExceeded()) throw new Error("Budget ceiling of " + fmtMoney(s.budgetUsd) + " reached — raise it in Providers, or turn off Stop on budget.");

  let asked = parseRef(opt.ref || opt.model || s.orchestratorModel);
  if (asked.provider === "preset") {
    const pr = presetById(asked.model);
    if (!pr) throw new Error("Preset '" + asked.model + "' no longer exists — pick another model.");
    messages = applyPresetToMessages(messages, pr);
    if (pr.temperature !== "" && pr.temperature != null && !isNaN(Number(pr.temperature))) opt = { ...opt, temperature: Number(pr.temperature) };
    asked = parseRef(pr.base);
  }
  const ref = freeGate(asked);
  if (ref !== asked) logEvent("free", "Free mode swapped " + asked.raw + " → " + ref.raw, { level: "info" });
  const chain = [ref];
  if (s.fallbackChain && opt.allowFallback !== false) {
    if (s.freeMode) {
      // Fall back only to other free models.
      for (const alt of freeCandidates()) {
        if (alt !== ref.raw && alt !== makeRef(ref.provider, ref.model)) chain.push(parseRef(alt));
        if (chain.length >= 3) break;
      }
    } else for (const pid of configuredProviders()) {
      if (pid === ref.provider) continue;
      const alt = providerCfg(pid).fallbackModels?.[0];
      if (alt) chain.push({ provider: pid, model: alt });
      if (chain.length >= 3) break;
    }
  }

  if (!providerReady(ref.provider)) {
    const p = providerCfg(ref.provider);
    if (needsBridge(ref.provider) && !state.bridge.connected) {
      return localDraft(messages, opt, `${p.label} must go through the bridge (${p.corsNote || "its host refuses browser requests"}), and the bridge is not connected.`);
    }
    if (!providerKey(ref.provider)) return localDraft(messages, opt, `No API key saved for ${p.label}.`);
  }

  let lastErr = null;
  for (let ci = 0; ci < chain.length; ci++) {
    const { provider: pid, model } = chain[ci];
    if (ci > 0) {
      if (!providerReady(pid)) continue;
      await logEvent("fallback", "Falling back to " + providerCfg(pid).label, { level: "warn", after: lastErr?.message?.slice(0, 120) });
    }
    try { return await callOne(pid, model, messages, opt) }
    catch (e) {
      lastErr = e;

  const wantStream = !!opt.stream && s.stream;
  const body = p.wire === "anthropic"
    ? buildAnthropicBody(pid, model, messages, { ...opt, stream: wantStream })
    : buildOpenAIBody(pid, model, messages, { ...opt, stream: wantStream });

  const key = cacheKey(pid, body);

    } catch (e) {
      clearTimeout(timer);
      if (RUN.abort && RUN.abort.signal.aborted) { endSpan(span, { ok: false, error: "aborted" }); throw new Error("Stopped by user") }
      if (timeoutCtl.signal.aborted) {
        lastErr = new Error(p.label + " timed out after " + s.timeoutSec + "s");
        if (attempt < 2) { await sleep(600); continue }
        endSpan(span, { ok: false, error: lastErr.message }); throw lastErr;
      }
      if (e instanceof TypeError && !needsBridge(pid)) {
        lastErr = new Error(p.label + " could not be reached from the browser. If this keeps happening it is probably CORS — route it through the bridge.");
      } else lastErr = e;
      if (attempt < 2) { await sleep(800 * Math.pow(2, attempt)); continue }
      endSpan(span, { ok: false, error: String(lastErr.message || lastErr) });
      throw lastErr;
    }
  }
  endSpan(span, { ok: false, error: "exhausted" });
  throw lastErr || new Error("Request failed");
}

/* ---------------------------------------------------------- model catalogue */
async function loadModels(silent = false, only = null) {
  const targets = only ? [only] : PROVIDER_IDS.filter(p => providerReady(p) || p === "openrouter");
  if (!silent) toast("Loading model catalogues…");
  let total = 0;
  for (const pid of targets) {
    const p = providerCfg(pid);
    if (!p.models) continue;
    const base = p.modelsBase || providerBase(pid);
    if (!base) continue;
    const url = base + p.models;
    try {
      const init = { method: "GET", headers: authHeaders(pid) };
      // A provider whose chat endpoint is blocked may still serve its model list
      // directly; z.ai is exactly that case, so ask before reaching for the bridge.
      const res = (p.modelsCors === "direct" || !needsBridge(pid))
        ? await fetch(url, init)
        : await routedFetch(pid, url, init);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const j = await res.json();
      const list = (j.data || j.models || []).filter(m => m && (m.id || m.name)).map(m => ({
        ...m, id: m.id || m.name, provider: pid, ref: makeRef(pid, m.id || m.name)
      }));
      state.modelsByProvider[pid] = list;
      total += list.length;
    } catch (e) {
      const fb = (p.fallbackModels || []).map(id => ({ id, provider: pid, ref: makeRef(pid, id), fallback: true }));
      if (fb.length) { state.modelsByProvider[pid] = fb; total += fb.length }
      if (!silent) await logEvent("models", p.label + " catalogue unavailable", { level: "warn", error: String(e.message || e) });
    }
  }
  state.models = Object.values(state.modelsByProvider).flat();
  state.modelsLoadedAt = ts();
  await putKV("modelsCache", { byProvider: state.modelsByProvider, loadedAt: state.modelsLoadedAt });
  if (!silent) toast(total + " models across " + Object.keys(state.modelsByProvider).length + " provider(s).");
  render();
}

/* ------------------------------------------------- OpenRouter OAuth (PKCE)
   The one genuine browser sign-in available here: no client secret, and the key
   it returns belongs to the user, not to this page. */
function b64url(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
async function startOpenRouterOAuth() {
  if (!crypto?.subtle) { toast("This browser cannot do PKCE — paste a key instead."); return }
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  LS.set("swarmos.pkce", verifier);
  const cb = location.origin + location.pathname;
  const url = "https://openrouter.ai/auth?callback_url=" + encodeURIComponent(cb) +
              "&code_challenge=" + challenge + "&code_challenge_method=S256" +
              "&key_label=" + encodeURIComponent(APP);
  if (location.protocol === "file:") {
    await copyText(url);
    alert("A file:// page cannot receive the OAuth redirect.\n\nThe sign-in URL has been copied. Open it, approve, then copy the ?code= value from the address bar back into the Providers tab.\n\nServing this file over http://localhost makes the round trip automatic.");
    return;
  }
  location.href = url;
}
async function completeOpenRouterOAuth(code) {
  const verifier = LS.get("swarmos.pkce", "");
  if (!code) { toast("No authorization code."); return false }
  try {
    const res = await fetch("https://openrouter.ai/api/v1/auth/keys", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code, code_verifier: verifier || undefined, code_challenge_method: verifier ? "S256" : undefined })
    });
    if (!res.ok) throw new Error("HTTP " + res.status + ": " + (await res.text().catch(() => "")).slice(0, 200));
    const j = await res.json();
    if (!j.key) throw new Error("No key in the response.");
    state.keys.openrouter = j.key;
    LS.remove("swarmos.pkce");
    await saveKeys();
    await logEvent("api", "Signed in to OpenRouter", { level: "info" });
    toast("Signed in to OpenRouter — key saved.");
    loadModels(true, "openrouter");
    return true;
  } catch (e) {
    toast("Sign-in failed: " + String(e.message || e).slice(0, 90));
    return false;
  }
}

/* ======================================================= WEB SEARCH + FETCH
   Every agent can search, whatever model it is running on. "auto" walks the
   configured engines and ends at a keyless fallback, so search works before you
   have added anything at all — just less well.
   ========================================================================== */
const SEARCH_ENGINES = {
  auto:       { label: "Auto (best available)", keyless: true },
  exa:        { label: "Exa", cors: "direct", keyUrl: "https://dashboard.exa.ai/api-keys", note: "Neural search with full page text." },
  firecrawl:  { label: "Firecrawl", cors: "direct", keyUrl: "https://firecrawl.dev/app/api-keys", note: "Search plus clean scraped markdown." },
  tavily:     { label: "Tavily", cors: "bridge", keyUrl: "https://app.tavily.com/home", note: "Built for agents. Needs the bridge — its API blocks browsers." },
  serper:     { label: "Serper (Google)", cors: "direct", keyUrl: "https://serper.dev/api-key", note: "Raw Google results, cheap." },
  brave:      { label: "Brave Search", cors: "direct", keyUrl: "https://api-dashboard.search.brave.com/app/keys", note: "Independent index." },
  duckduckgo: { label: "Keyless (no API key)", cors: "direct", keyless: true, note: "Reads a lightweight results page through the keyless Jina reader. Real ranked results, no signup — slower and less reliable than a proper search API." }
};
function searchKey(engine) { return state.searchKeys[engine] || "" }
function activeSearchEngine() {
  const want = state.settings.searchEngine || "auto";
  if (want !== "auto") return want;
  if (state.settings.freeMode) return "duckduckgo";   // metered search APIs stay out of free mode
  for (const e of ["exa", "firecrawl", "serper", "brave", "tavily"]) {
    if (!searchKey(e) && !bridgeHasSearchKey(e)) continue;
    if (SEARCH_ENGINES[e].cors === "bridge" && !state.bridge.connected) continue;
    return e;
  }
  return "duckduckgo";
}
function bridgeHasSearchKey(engine) { return state.bridge.connected && (state.bridge.searchProviders || []).includes(engine) }
async function searchFetch(engine, url, init) {
  const viaBridge = SEARCH_ENGINES[engine]?.cors === "bridge" || (!searchKey(engine) && bridgeHasSearchKey(engine));
  if (!viaBridge) return fetch(url, init);
  return bridgeFetch(url, init, null, searchKey(engine) ? null : engine);
}
async function webSearch(query, opts = {}) {
  const n = clamp(Number(opts.max_results || state.settings.webMaxResults) || 5, 1, 15);
  const engine = opts.engine && opts.engine !== "auto" ? opts.engine : activeSearchEngine();
  const span = startSpan("search", engine + ": " + String(query).slice(0, 60));
  RUN.metrics.searches++;
  try {
    const raw = await runSearch(engine, siteScoped(engine, query), n);
    const results = raw.filter(r => domainAllowed(r.url));
    endSpan(span, { ok: true, count: results.length, filtered: raw.length - results.length });
    await logEvent("search", engine + " · " + results.length + " result(s)", { level: "info", query: String(query).slice(0, 120) });
    return { ok: true, engine, query, count: results.length, results };
  } catch (e) {
    endSpan(span, { ok: false, error: String(e.message || e) });
    if (engine !== "duckduckgo") {
      try {
        const results = (await runSearch("duckduckgo", siteScoped("duckduckgo", query), n)).filter(r => domainAllowed(r.url));
        return { ok: true, engine: "duckduckgo", fellBackFrom: engine, reason: String(e.message || e).slice(0, 160), query, count: results.length, results };
      } catch {}
    }
    return { ok: false, engine, error: String(e.message || e), results: [] };
  }
}
/* With a short allow-list, ask the engine for those sites instead of filtering an unrelated page of results away. */
function siteScoped(engine, query) {
  const allow = domainList(state.settings.webAllowDomains);
  if (!allow.length || allow.length > 6 || !["duckduckgo", "serper", "brave"].includes(engine)) return query;
  return query + " (" + allow.map(d => "site:" + d).join(" OR ") + ")";
}
async function runSearch(engine, query, n) {
  const J = { "Content-Type": "application/json" };
  if (engine === "exa") {
    const res = await searchFetch(engine, "https://api.exa.ai/search", { method: "POST",
      headers: { ...J, "x-api-key": searchKey("exa") },
      body: JSON.stringify({ query, numResults: n, contents: { text: { maxCharacters: 1500 } } }) });
    if (!res.ok) throw new Error("Exa " + res.status);
    const j = await res.json();
    return (j.results || []).map(r => ({ title: r.title, url: r.url, snippet: (r.text || r.summary || "").slice(0, 600), published: r.publishedDate }));
  }
  if (engine === "firecrawl") {
    const res = await searchFetch(engine, "https://api.firecrawl.dev/v1/search", { method: "POST",
      headers: { ...J, Authorization: "Bearer " + searchKey("firecrawl") },
      body: JSON.stringify({ query, limit: n }) });
    if (!res.ok) throw new Error("Firecrawl " + res.status);
    const j = await res.json();
    return (j.data || j.results || []).map(r => ({ title: r.title, url: r.url, snippet: (r.description || r.markdown || "").slice(0, 600) }));
  }
  if (engine === "tavily") {
    const res = await searchFetch(engine, "https://api.tavily.com/search", { method: "POST",
      headers: { ...J, Authorization: "Bearer " + searchKey("tavily") },
      body: JSON.stringify({ query, max_results: n, search_depth: "advanced" }) });
    if (!res.ok) throw new Error("Tavily " + res.status);
    const j = await res.json();
    return (j.results || []).map(r => ({ title: r.title, url: r.url, snippet: (r.content || "").slice(0, 600), published: r.published_date }));
  }
  if (engine === "serper") {
    const res = await searchFetch(engine, "https://google.serper.dev/search", { method: "POST",
      headers: { ...J, "X-API-KEY": searchKey("serper") },
      body: JSON.stringify({ q: query, num: n }) });
    if (!res.ok) throw new Error("Serper " + res.status);
    const j = await res.json();
    return (j.organic || []).slice(0, n).map(r => ({ title: r.title, url: r.link, snippet: r.snippet || "" }));
  }
  if (engine === "brave") {
    const res = await searchFetch(engine, "https://api.search.brave.com/res/v1/web/search?count=" + n + "&q=" + encodeURIComponent(query),
      { method: "GET", headers: { Accept: "application/json", "X-Subscription-Token": searchKey("brave") } });
    if (!res.ok) throw new Error("Brave " + res.status);
    const j = await res.json();
    return (j.web?.results || []).map(r => ({ title: r.title, url: r.url, snippet: r.description || "" }));
  }
  return keylessSearch(query, n);
}

/* Search with no API key at all.
   Two sources, tried in order. First a lightweight results page read through
   the keyless Jina reader — it renders to markdown, and unwrapping DuckDuckGo's
   redirect parameter recovers the real destination URLs. Second, the public
   instant-answer API, which only handles definitional queries but is a useful
   top-up. This is why every agent can search before you have configured
   anything; a real search key is better, not required. */
function unwrapRedirect(u) {
  try {
    const p = new URL(u);
    const w = p.searchParams.get("uddg") || p.searchParams.get("url") || p.searchParams.get("u");
    return w ? decodeURIComponent(w) : u;
  } catch { return u }
}
async function keylessSearch(query, n) {
  const out = [], seen = new Set();
  const push = (title, url, snippet) => {
    if (!url || seen.has(url) || !/^https?:\/\//.test(url)) return;
    if (/duckduckgo\.com|r\.jina\.ai|bing\.com/.test(url)) return;
    seen.add(url);
    out.push({ title: String(title || url).slice(0, 180), url, snippet: String(snippet || "").slice(0, 600) });
  };
  try {
    const r = await fetch("https://r.jina.ai/https://lite.duckduckgo.com/lite/?q=" + encodeURIComponent(query),
      { headers: { Accept: "text/plain" } });
    if (r.ok) {
      const text = await r.text();
      const lines = text.split("\n");
      for (let i = 0; i < lines.length && out.length < n * 2; i++) {
        const m = lines[i].match(/\[([^\]]{4,180})\]\((https?:\/\/[^)\s]+)\)/);
        if (!m) continue;
        // the line or two after a result usually carries its snippet
        const snippet = [lines[i + 1], lines[i + 2]].filter(Boolean)
          .map(s => s.trim()).filter(s => s && !s.startsWith("[") && !s.startsWith("|")).join(" ");
        push(m[1], unwrapRedirect(m[2]), snippet);
      }
    }
  } catch { /* fall through to the instant-answer API */ }

  if (out.length < n) {
    try {
      const r2 = await fetch("https://api.duckduckgo.com/?format=json&no_html=1&skip_disambig=1&q=" + encodeURIComponent(query));
      if (r2.ok) {
        const j = await r2.json();
        if (j.AbstractURL) push(j.Heading || query, j.AbstractURL, j.AbstractText);
        (j.RelatedTopics || []).forEach(t => {
          if (t.FirstURL) push((t.Text || "").slice(0, 100), t.FirstURL, t.Text);
          (t.Topics || []).forEach(s2 => { if (s2.FirstURL) push((s2.Text || "").slice(0, 100), s2.FirstURL, s2.Text) });
        });
      }
    } catch { /* nothing more to try */ }
  }

  if (!out.length) throw new Error("Keyless search returned nothing. Add an Exa, Firecrawl, Serper or Brave key in Providers → Web for reliable search.");
  return out.slice(0, n);
}
/* Read a page as markdown. r.jina.ai works cross-origin and needs no key, which
   is what makes "give every agent a browser" practical from a web page. */
async function fetchUrl(url, maxChars) {
  const lim = clamp(Number(maxChars || state.settings.fetchMaxChars) || 12000, 500, 80000);
  let u; try { u = new URL(url) } catch { return { ok: false, error: "That is not a valid URL." } }
  if (!/^https?:$/.test(u.protocol)) return { ok: false, error: "Only http and https can be fetched." };
  if (!domainAllowed(url)) return { ok: false, error: "Blocked by the web source policy (Providers → Web). Choose a source on an allowed domain." };
  const span = startSpan("fetch", u.host + u.pathname.slice(0, 40));
  RUN.metrics.fetches++;
  try {
    if (searchKey("firecrawl")) {
      const r = await fetch("https://api.firecrawl.dev/v1/scrape", { method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + searchKey("firecrawl") },
        body: JSON.stringify({ url, formats: ["markdown"] }) });
      if (r.ok) {
        const j = await r.json();
        const md2 = j.data?.markdown || "";
        if (md2) { endSpan(span, { ok: true }); return { ok: true, via: "firecrawl", url, chars: md2.length, content: md2.slice(0, lim) } }
      }
    }
    const r = await fetch("https://r.jina.ai/" + url, { headers: { Accept: "text/plain" } });
    if (!r.ok) throw new Error("Reader " + r.status);
    const text = await r.text();
    endSpan(span, { ok: true });
    return { ok: true, via: "jina-reader", url, chars: text.length, truncated: text.length > lim, content: text.slice(0, lim) };
  } catch (e) {
    endSpan(span, { ok: false, error: String(e.message || e) });
    return { ok: false, error: String(e.message || e) };
  }
}

async function saveKeys() {

    await putKV("keys", state.keys);

/* ------------------------------------------------------------- capability */
function routeModelFor(role, need = {}) {
  const explicit = state.settings.defaultAgentModel;
  const pref = TASK_MODEL_PREF[role] || TASK_MODEL_PREF.default || [];
  const def = parseRef(explicit);
  for (const id of [...pref, explicit].filter(Boolean)) {
    const r = parseRef(id, def.provider);
    if (!providerReady(r.provider)) continue;
    if (need.tools && !modelSupports(r.model, "tools")) continue;
    if (need.vision && !modelInputs(r.model).includes("image")) continue;
    if (need.context && (modelContext(r.model) || 0) < need.context) continue;
    return makeRef(r.provider, r.model);
  }
  if (providerReady(def.provider)) return explicit;
  const anyProvider = configuredProviders()[0];
  if (anyProvider) {
    const m = providerCfg(anyProvider).fallbackModels?.[0] || state.modelsByProvider[anyProvider]?.[0]?.id;
    if (m) return makeRef(anyProvider, m);
  }
  return explicit;
}

async function logEvent(type, label, extra = {}) {
  const e = { id: uid("evt"), type, label, created: ts(), ...extra };
  state.events.unshift(e);
  if (state.events.length > 800) state.events.length = 800;
  try { await DB.put("events", e) } catch {}
  return e;
}

/* --------------------------------------------------------- system prompt */
function orchestratorSystem() {
  const s = state.settings;
  const bp = BLUEPRINTS[s.blueprint] || BLUEPRINTS.auto;
  const mem = state.memories.length
    ? "\n\nDURABLE MEMORY (things this user has told you before):\n" + state.memories.slice(0, 24).map((m, i) => `[M${i + 1}] ${m.text}`).join("\n")
    : "";
  const ws = state.files.length
    ? `\n\nWORKSPACE: ${state.files.length} file(s) are imported locally (${state.files.slice(0, 8).map(f => f.name).join(", ")}${state.files.length > 8 ? ", …" : ""}). Use search_workspace and read_workspace_file rather than guessing their contents.`
    : "";
  const roster = bp.roster.length ? `\n\nThe user has selected the "${bp.label}" blueprint. Suggested roster: ${bp.roster.join(", ")}. Deviate if the request calls for it, and say so when you do.` : "";

  const provLines = configuredProviders().map(p => {
    const c = providerCfg(p);
    return "- " + p + " (" + c.label + ")" + (c.subscription ? " — runs on the user's subscription, not per-token credit" : "") + (c.wire === "cli" ? " — spawns the local CLI; ask it for parallel sub-agents to engage that CLI's own swarm" : "");
  }).join("\n");
  const skillNote = skillsPreamble("orchestrator");
  const beaconNote = state.settings.beaconRead ? beaconMemory() : "";

  return `You are the Orchestrator of ${APP} — an agentic operating system running in the user's browser.

You are talking directly to the user. Everything you say is read by a person, so write like a capable colleague: direct, concrete, no filler, no restating their question back at them.

WHAT MAKES YOU DIFFERENT FROM AN ORDINARY CHAT MODEL
You command a swarm. Other AI models are available to you as tools. spawn_agent calls one; spawn_swarm calls many in parallel; debate puts them in opposition; poll_models measures their disagreement; verify_claim has one of them try to falsify something. These are real model calls billed to the user's OpenRouter account, not a roleplay. Use them when parallel work or an independent perspective genuinely improves the answer, and answer directly when it does not. A trivial question does not need a committee, and spending the user's money to convene one is a failure, not thoroughness.

THE DEFINITION OF DONE IS NOT OPTIONAL
For any request that involves producing work, your FIRST tool call is define_done. Criteria must be checkable by a stranger: name the command, the file, the property, or the source that settles each one. Before your final answer, call check_done. If a criterion comes back unmet, you may not quietly drop it — either fix it or state plainly in your answer that it is unmet and why. The user will see the Definition of Done rendered next to your reply whether or not you mention it, so it must be honest.

HOW TO RUN A SWARM WELL
- Give each agent a genuinely different angle. Two agents with the same brief produce the same answer twice and the anti-echo guard will flag it.
- Agents cannot see this conversation. Every brief must be self-contained.
- Name a model explicitly when the job needs a specific strength; otherwise omit it and the router picks by role.
- Read what comes back. Contradictions between agents are signal — surface them rather than averaging them away.
- Attribute in your answer: say which model found what when it matters.

HOW TO ANSWER
Lead with the answer or the decision. Then the reasoning, then what is uncertain. Use markdown headings and tables where they help and nowhere else.

ARTIFACTS — THE USER WATCHES THEM BUILD LIVE
When you make something the user will run, read or keep — an app, a game, a web page, a tool, a diagram, a document, a dataset — write it as ONE complete fenced block with a filename, for example \`\`\`html title="snake.html". It streams into the Artifact panel and renders as you type, so write the file top to bottom, complete, with no placeholders or "rest unchanged" gaps.
- Apps and games: a single self-contained HTML file (inline CSS and JS; libraries from cdn.jsdelivr.net are fine). Handle keyboard and touch; size to the viewport.
- React: \`\`\`jsx with a default-exported component. React hooks are in scope and Tailwind classes work. No other npm imports.
- Diagrams: \`\`\`mermaid. Vector art: \`\`\`svg. Documents and reports: \`\`\`markdown title="report.md". Data: \`\`\`csv or \`\`\`json.
- To revise, re-emit the whole file with the SAME title; it becomes the next version and the user can compare.
Keep chat prose short around an artifact; the panel is where the work is. Agents can do the same, or call create_artifact.

HONESTY
Report what actually happened. If an agent failed, say so. If the swarm disagreed, say so. If you could not verify something, mark it unverified rather than smoothing it over. Never claim a check ran that did not run.${roster}${ws}${mem}

PROVIDERS AVAILABLE TO YOU RIGHT NOW
Pass "provider:model" as a spawned agent's model. These are configured and working:
${provLines || "- none configured; you are in local-draft mode and no agent will actually run"}
Spread a swarm across providers on purpose. Different families fail in different ways, so agreement between two of them means more than agreement between two instances of one. Providers marked as running on a subscription do not consume this run's dollar budget — prefer them for bulk work. If you need a model you cannot see here, call list_models.

${jevReady() ? `DECISION LAYER
A System One model (Jev) is sizing each task and routing it to the cheapest tier that can do it, scoring every contribution, pre-flighting tool calls, and standing down agents whose output does not justify their cost. You do not call it — it runs underneath you. Two consequences for you: an agent you spawn without naming a model may come back on a cheaper model than you expected, and a spawn_swarm result may report agents that were stood down. When it does, do not re-dispatch the same angle.` : ""}

WEB ACCESS
Every agent you spawn can search the live web and read pages, on any provider. Pass web:true when the work depends on anything current. A model that cannot call tools still gets results fetched into its brief, so do not avoid one for that reason.${skillNote}

${beaconNote}

Today is ${new Date().toDateString()}. Budget so far this run: ${fmtMoney(RUN.metrics.cost)} of ${fmtMoney(state.settings.budgetUsd)}.`;
}

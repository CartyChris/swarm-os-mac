name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bridge unit tests + embedded-bridge sync check
        run: npm test
      - name: End-to-end in Chromium (fake local Ollama, free mode, selfTest)
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: CDN-backed features (KaTeX, Pyodide, Mermaid, React previews)
        run: npm run test:cdn
        env:
          CHROME_PATH: /usr/bin/google-chrome
          REQUIRE_CDN: "1"
      - name: Electron smoke test (dev tree)
        run: xvfb-run -a npm run test:electron
        env:
          SMOKE_NO_SANDBOX: "1"

  mac:
    name: macOS app (build + smoke)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: End-to-end in Chrome
        run: npm run test:e2e
      - name: Build .dmg and .zip (Apple Silicon + Intel)
        run: |
          if [ -n "$CSC_LINK" ]; then
            npx electron-builder --mac --publish never
          else
            echo "No signing certificate configured: building ad-hoc signed (runs locally; Gatekeeper will ask once)."
            # Unset secrets arrive as empty strings; electron-builder would read an
            # empty CSC_LINK as a path (the repo root) and try to sign with it.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npx electron-builder --mac --publish never -c.mac.identity=- -c.mac.hardenedRuntime=false
          fi
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Smoke test the packaged Apple Silicon app
        run: node test/electron.smoke.mjs "dist/mac-arm64/SWARM OS.app/Contents/MacOS/SWARM OS"
      - name: Verify the code signature
        run: codesign --verify --deep --strict --verbose=2 "dist/mac-arm64/SWARM OS.app"
      - uses: actions/upload-artifact@v4
        with:
          name: SWARM-OS-mac
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: mac
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SWARM-OS-mac
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
